var T=[{"g": "I", "t": "1. Teori perkembangan kognitif Jean Piaget", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Teori Piaget menjelaskan bahwa cara berpikir anak berkembang melalui tahapan. Anak membangun pengetahuan dengan berinteraksi dengan lingkungan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu guru memilih tingkat abstraksi, media, dan aktivitas yang sesuai dengan perkembangan berpikir siswa.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Kenali tahap perkembangan secara umum; gunakan benda konkret untuk konsep yang masih abstrak; berikan kesempatan mencoba, mengelompokkan, membandingkan, dan menyimpulkan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Saat mengajarkan algoritma kepada siswa SMP, guru menggunakan kartu instruksi dan simulasi gerak sebelum meminta siswa menulis pseudocode. Aktivitas konkret menjadi jembatan menuju pemikiran abstrak.<\/p><\/div><div class=\"blk cat\"><b class=\"lb\">Catatan<\/b><p>Tahap usia Piaget adalah gambaran umum, bukan label kaku. Kemampuan setiap anak dapat berbeda.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Konsep<\/b><\/th><th><b>Makna<\/b><\/th><th><b>Contoh di kelas<\/b><\/th><\/tr><tr><td>Skema<\/td><td>Kerangka pengetahuan yang dimiliki seseorang.<\/td><td>Siswa memiliki skema bahwa algoritma adalah urutan langkah.<\/td><\/tr><tr><td>Asimilasi<\/td><td>Informasi baru dimasukkan ke skema yang sudah ada.<\/td><td>Siswa mengenali resep sebagai contoh urutan instruksi.<\/td><\/tr><tr><td>Akomodasi<\/td><td>Skema diubah karena informasi baru tidak cocok.<\/td><td>Siswa memahami bahwa algoritma juga dapat memuat percabangan.<\/td><\/tr><tr><td>Ekuilibrasi<\/td><td>Proses menyeimbangkan asimilasi dan akomodasi.<\/td><td>Siswa memperbaiki pemahamannya setelah membandingkan beberapa algoritma.<\/td><\/tr><\/table><\/div><div class=\"wrap\"><table><tr><th><b>Tahap<\/b><\/th><th><b>Perkiraan usia<\/b><\/th><th><b>Karakteristik umum<\/b><\/th><th><b>Implikasi pembelajaran<\/b><\/th><\/tr><tr><td>Sensorimotor<\/td><td>0–2 tahun<\/td><td>Belajar melalui indra dan gerak.<\/td><td>Eksplorasi sensorimotor; umumnya konteks PAUD awal.<\/td><\/tr><tr><td>Praoperasional<\/td><td>2–7 tahun<\/td><td>Bahasa dan simbol berkembang; berpikir masih intuitif.<\/td><td>Gunakan gambar, permainan, dan contoh konkret.<\/td><\/tr><tr><td>Operasional konkret<\/td><td>7–11 tahun<\/td><td>Logika berkembang untuk objek/situasi konkret.<\/td><td>Gunakan manipulatif, tabel, benda, dan demonstrasi.<\/td><\/tr><tr><td>Operasional formal<\/td><td>11 tahun ke atas<\/td><td>Mulai mampu berpikir abstrak dan hipotetis.<\/td><td>Gunakan hipotesis, variabel, algoritma, dan pemecahan masalah.<\/td><\/tr><\/table><\/div>"}, {"g": "I", "t": "2. Teori sosiokultural Lev Vygotsky", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Vygotsky menekankan bahwa perkembangan berpikir dibentuk melalui interaksi sosial, bahasa, budaya, dan bantuan dari orang yang lebih mampu.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mendorong guru menggunakan diskusi, kerja kelompok, pemodelan, dan bantuan bertahap.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Identifikasi kemampuan yang dapat dilakukan siswa sendiri; tentukan tugas sedikit di atas kemampuan mandiri; berikan bantuan; kurangi bantuan saat siswa semakin mampu.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa belum dapat membuat diagram alir sendiri. Guru memberi contoh satu langkah, teman sebaya memberi petunjuk, lalu siswa menyelesaikan diagram berikutnya secara mandiri.<\/p><\/div><div class=\"blk cat\"><b class=\"lb\">Catatan<\/b><p>ZPD bukan sekadar tugas yang mudah atau sangat sulit, melainkan rentang tugas yang dapat diselesaikan dengan bantuan.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Istilah<\/b><\/th><th><b>Penjelasan<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>ZPD<\/td><td>Zona antara kemampuan mandiri dan kemampuan yang dapat dicapai dengan bantuan.<\/td><td>Siswa dapat membuat algoritma sederhana dengan petunjuk guru.<\/td><\/tr><tr><td>Scaffolding<\/td><td>Dukungan sementara yang dikurangi bertahap.<\/td><td>Contoh lengkap → petunjuk sebagian → latihan mandiri.<\/td><\/tr><tr><td>MKO<\/td><td>Orang yang lebih menguasai pengetahuan/keterampilan tertentu.<\/td><td>Guru, tutor, atau teman sebaya yang kompeten.<\/td><\/tr><tr><td>Bahasa dan interaksi<\/td><td>Alat berpikir dan membangun pemahaman.<\/td><td>Siswa menjelaskan alasan urutan algoritma kepada kelompok.<\/td><\/tr><\/table><\/div>"}, {"g": "I", "t": "3. Teori belajar Jerome Bruner", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Bruner menjelaskan representasi pengetahuan melalui tiga cara: enaktif, ikonik, dan simbolik. Ia juga mendukung pembelajaran penemuan dengan bimbingan yang tepat.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu guru menyajikan materi dari pengalaman langsung menuju gambar lalu simbol atau abstraksi.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Mulai dengan aktivitas manipulasi atau praktik; tampilkan representasi visual; lanjutkan ke istilah, rumus, kode, atau simbol; ajukan pertanyaan pemandu.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Untuk konsep percabangan: siswa memainkan permainan &#x27;jika hujan maka buka payung&#x27; (enaktif), melihat diagram alir (ikonik), lalu menulis IF–ELSE (simbolik).<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Representasi<\/b><\/th><th><b>Makna<\/b><\/th><th><b>Contoh Informatika<\/b><\/th><\/tr><tr><td>Enaktif<\/td><td>Memahami melalui tindakan atau manipulasi.<\/td><td>Siswa memeragakan instruksi algoritma.<\/td><\/tr><tr><td>Ikonik<\/td><td>Memahami melalui gambar atau visual.<\/td><td>Siswa membaca flowchart.<\/td><\/tr><tr><td>Simbolik<\/td><td>Memahami melalui bahasa, angka, atau simbol.<\/td><td>Siswa menulis pseudocode atau kode program.<\/td><\/tr><\/table><\/div>"}, {"g": "I", "t": "4. Teori belajar bermakna David Ausubel", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Belajar bermakna terjadi ketika informasi baru dihubungkan secara terstruktur dengan pengetahuan yang telah dimiliki siswa.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu siswa memahami hubungan antarkonsep, bukan sekadar menghafal.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Gali pengetahuan awal; gunakan pengatur awal (advance organizer) seperti peta konsep atau gambaran besar; hubungkan materi baru dengan pengalaman yang sudah dikenal.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Sebelum belajar basis data, guru mengajak siswa membahas daftar kontak telepon. Dari nama dan nomor yang tersusun, siswa mengenali konsep tabel, kolom, baris, dan data.<\/p><\/div>"}, {"g": "I", "t": "5. Perkembangan moral: Jean Piaget", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Piaget menjelaskan perubahan pemahaman anak tentang aturan, niat, tanggung jawab, dan keadilan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu guru membina perilaku dengan dialog dan pemahaman alasan di balik aturan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Untuk siswa yang lebih muda, jelaskan aturan secara konsisten; ajak siswa yang lebih matang berdiskusi tentang alasan, kesepakatan, dan dampak tindakan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Saat terjadi pelanggaran aturan kerja kelompok, guru tidak hanya menyebut &#x27;aturan dilanggar&#x27;, tetapi mengajak siswa memahami dampaknya terhadap anggota kelompok.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Tahap<\/b><\/th><th><b>Ciri umum<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Moralitas heteronom<\/td><td>Aturan dianggap tetap dan ditentukan otoritas; akibat tindakan sangat diperhatikan.<\/td><td>Siswa menganggap semua pelanggaran harus mendapat hukuman yang sama.<\/td><\/tr><tr><td>Moralitas otonom<\/td><td>Mulai memahami bahwa aturan merupakan kesepakatan dan niat serta keadilan perlu dipertimbangkan.<\/td><td>Siswa berdiskusi mengubah aturan kelompok agar adil bagi semua.<\/td><\/tr><\/table><\/div>"}, {"g": "I", "t": "6. Perkembangan moral Lawrence Kohlberg", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Kohlberg menjelaskan perkembangan penalaran moral melalui tiga tingkat dan enam tahap.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu guru memahami alasan yang digunakan siswa ketika menentukan benar atau salah.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Gunakan dilema moral yang aman dan sesuai usia; minta siswa menjelaskan alasan; fasilitasi diskusi dari sudut pandang berbeda tanpa mempermalukan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa menemukan temannya menyontek. Guru mengajak kelas membahas kejujuran, aturan, kepercayaan, dan dampak terhadap orang lain.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Tingkat/tahap<\/b><\/th><th><b>Orientasi penalaran<\/b><\/th><th><b>Contoh alasan siswa<\/b><\/th><\/tr><tr><td>Prakonvensional 1 — hukuman<\/td><td>Menghindari hukuman.<\/td><td>Saya tidak menyontek karena takut dihukum.<\/td><\/tr><tr><td>Prakonvensional 2 — kepentingan diri<\/td><td>Pertukaran atau keuntungan pribadi.<\/td><td>Saya membantu jika nanti saya juga dibantu.<\/td><\/tr><tr><td>Konvensional 3 — hubungan baik<\/td><td>Ingin diterima dan dianggap baik.<\/td><td>Saya jujur agar teman percaya kepada saya.<\/td><\/tr><tr><td>Konvensional 4 — aturan dan ketertiban<\/td><td>Menjaga aturan dan sistem.<\/td><td>Menyontek melanggar aturan yang berlaku.<\/td><\/tr><tr><td>Pascakonvensional 5 — kontrak sosial<\/td><td>Memahami aturan sebagai kesepakatan untuk melindungi hak.<\/td><td>Aturan dibuat untuk menjaga keadilan dan dapat ditinjau secara bertanggung jawab.<\/td><\/tr><tr><td>Pascakonvensional 6 — prinsip universal<\/td><td>Berpegang pada prinsip etis universal.<\/td><td>Kejujuran dan martabat manusia harus dihormati.<\/td><\/tr><\/table><\/div><p>Catatan: Tahap Kohlberg menggambarkan pola penalaran, bukan cap permanen pada seseorang. Jangan menyimpulkan tahap moral siswa hanya dari satu jawaban.<\/p>"}, {"g": "I", "t": "7. Etika kepedulian Carol Gilligan", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Gilligan menyoroti pentingnya kepedulian, hubungan, tanggung jawab, dan konteks ketika seseorang membuat keputusan moral.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengingatkan guru agar keputusan tidak hanya berorientasi aturan, tetapi juga mempertimbangkan relasi dan kebutuhan pihak terdampak.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Dengarkan pihak yang terlibat; pahami konteks; cari solusi yang menjaga keselamatan, keadilan, dan kepedulian.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Ketika siswa mengucilkan teman, guru memulihkan hubungan, memastikan siswa yang terdampak aman, dan membimbing pelaku memahami dampak perilakunya.<\/p><\/div>"}, {"g": "I", "t": "8. Karakteristik dan kebutuhan peserta didik", "h": "<p>Karakteristik peserta didik adalah ciri, kondisi, pengalaman, dan kebutuhan yang memengaruhi cara mereka belajar. Guru perlu mengenalinya melalui asesmen, observasi, dialog, dan komunikasi dengan keluarga bila relevan.<\/p><div class=\"wrap\"><table><tr><th><b>Aspek<\/b><\/th><th><b>Hal yang diperhatikan<\/b><\/th><th><b>Contoh penerapan<\/b><\/th><\/tr><tr><td>Fisik dan motorik<\/td><td>Kondisi kesehatan, koordinasi, akses gerak.<\/td><td>Atur posisi duduk dan akses perangkat.<\/td><\/tr><tr><td>Kognitif<\/td><td>Pengetahuan awal, penalaran, pemecahan masalah.<\/td><td>Berikan tugas bertahap dan pertanyaan penuntun.<\/td><\/tr><tr><td>Sosial-emosional<\/td><td>Interaksi, regulasi emosi, rasa aman.<\/td><td>Buat kesepakatan kelas dan budaya saling menghargai.<\/td><\/tr><tr><td>Bahasa/komunikasi<\/td><td>Bahasa yang dikuasai dan cara berkomunikasi.<\/td><td>Gunakan instruksi sederhana, visual, atau alternatif komunikasi.<\/td><\/tr><tr><td>Minat dan motivasi<\/td><td>Topik yang menarik dan alasan belajar.<\/td><td>Gunakan konteks permainan, musik, olahraga, atau lingkungan.<\/td><\/tr><tr><td>Latar belakang budaya<\/td><td>Pengalaman, bahasa, tradisi, lingkungan.<\/td><td>Gunakan contoh kontekstual yang tidak stereotip.<\/td><\/tr><tr><td>Kesiapan belajar<\/td><td>Penguasaan prasyarat dan dukungan yang dibutuhkan.<\/td><td>Lakukan asesmen awal sebelum unit baru.<\/td><\/tr><\/table><\/div>"}, {"g": "I", "t": "9. Pembelajaran berdiferensiasi", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Pembelajaran berdiferensiasi adalah pendekatan yang secara sadar menyesuaikan pengalaman belajar berdasarkan kesiapan, minat, dan profil belajar peserta didik.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memberi akses dan tantangan yang sesuai agar setiap siswa dapat mencapai tujuan esensial.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Lakukan asesmen awal; tetapkan tujuan yang sama atau kompetensi esensial yang jelas; variasikan dukungan, sumber, proses, atau cara menunjukkan pemahaman; pantau kemajuan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Dalam materi data, semua siswa belajar menafsirkan data. Sebagian menggunakan tabel sederhana dengan panduan, sebagian menganalisis grafik, dan siswa yang siap membandingkan dua kumpulan data.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Dimensi<\/b><\/th><th><b>Apa yang disesuaikan?<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Konten<\/td><td>Materi, sumber, tingkat kompleksitas atau cara mengakses informasi.<\/td><td>Teks ringkas, video berteks, dan bacaan lebih mendalam.<\/td><\/tr><tr><td>Proses<\/td><td>Aktivitas dan dukungan saat belajar.<\/td><td>Latihan terbimbing, diskusi, simulasi, atau eksplorasi mandiri.<\/td><\/tr><tr><td>Produk<\/td><td>Cara siswa menunjukkan pemahaman.<\/td><td>Laporan, presentasi, infografik, demonstrasi, atau rekaman penjelasan.<\/td><\/tr><tr><td>Lingkungan<\/td><td>Pengaturan ruang, suasana, dan akses belajar.<\/td><td>Area tenang, tempat kolaborasi, instruksi visual, atau perangkat bantu.<\/td><\/tr><\/table><\/div><p>Tiga pertimbangan umum: kesiapan belajar (readiness), minat (interest), dan profil belajar (learning profile). Diferensiasi bukan berarti membuat tujuan berbeda tanpa alasan atau memberi label tetap kepada siswa.<\/p>"}, {"g": "I", "t": "10. Teaching at the Right Level (TaRL)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>TaRL adalah pendekatan yang menyesuaikan pembelajaran dengan tingkat kemampuan aktual peserta didik, bukan hanya berdasarkan usia atau kelas.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memastikan pembelajaran dimulai dari kemampuan yang benar-benar dimiliki siswa dan memberi dukungan untuk maju ke tingkat berikutnya.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Lakukan asesmen singkat; kelompokkan sementara berdasarkan kebutuhan/kemampuan; berikan aktivitas sesuai level; pantau kemajuan; susun ulang kelompok secara fleksibel.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Sebelum belajar algoritma, guru memetakan siswa: kelompok A perlu menguatkan urutan instruksi, kelompok B memahami percabangan sederhana, dan kelompok C siap membuat algoritma dengan beberapa kondisi.<\/p><\/div><p>Hal penting: kelompok TaRL bersifat fleksibel dan tidak boleh menjadi label permanen. Gunakan bukti belajar untuk memindahkan siswa ketika kemampuannya berkembang.<\/p>"}, {"g": "I", "t": "11. Culturally Responsive Teaching (CRT)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>CRT adalah pendekatan yang menghubungkan pembelajaran dengan identitas, pengalaman, bahasa, pengetahuan, dan konteks budaya peserta didik secara menghargai dan adil.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Meningkatkan relevansi pembelajaran, rasa memiliki, partisipasi, dan penghargaan terhadap keberagaman.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Kenali konteks siswa tanpa membuat stereotip; gunakan contoh lokal yang beragam; beri ruang bagi perspektif siswa; pastikan semua siswa memiliki kesempatan berpartisipasi.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Saat belajar data, siswa mengumpulkan data sederhana tentang pilihan transportasi atau makanan khas di lingkungan masing-masing, lalu membandingkan data tanpa menilai budaya tertentu lebih tinggi.<\/p><\/div><p>CRT bukan sekadar menampilkan pakaian atau makanan tradisional. Intinya adalah menjadikan pengalaman dan pengetahuan budaya sebagai sumber belajar serta membangun kelas yang adil.<\/p>"}, {"g": "I", "t": "12. Pendidikan inklusif dan akomodasi", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Pendidikan inklusif memastikan setiap peserta didik, termasuk penyandang disabilitas dan siswa dengan kebutuhan dukungan tertentu, dapat berpartisipasi dan belajar bersama secara bermakna.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Menghilangkan hambatan akses, partisipasi, dan pembelajaran; menghormati martabat serta potensi setiap siswa.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Identifikasi kebutuhan melalui komunikasi dan asesmen yang sesuai; konsultasikan dengan keluarga dan tenaga terkait; berikan akomodasi; pantau efektivitasnya.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa dengan hambatan penglihatan mendapat bahan digital yang kompatibel dengan pembaca layar, kontras yang memadai, dan deskripsi teks untuk gambar.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Istilah<\/b><\/th><th><b>Makna<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Akomodasi<\/td><td>Mengubah cara, waktu, media, atau lingkungan tanpa mengubah kompetensi inti yang diukur.<\/td><td>Tambahan waktu atau format teks yang dapat dibaca pembaca layar.<\/td><\/tr><tr><td>Modifikasi<\/td><td>Mengubah target atau kompleksitas kompetensi berdasarkan kebutuhan dan kebijakan yang berlaku.<\/td><td>Target pembelajaran yang disesuaikan melalui perencanaan individual.<\/td><\/tr><tr><td>PPI<\/td><td>Program Pembelajaran Individual untuk merencanakan tujuan, dukungan, dan evaluasi individual bila diperlukan.<\/td><td>Tujuan komunikasi fungsional dan dukungan visual untuk siswa tertentu.<\/td><\/tr><tr><td>UDL<\/td><td>Universal Design for Learning; merancang pembelajaran sejak awal agar dapat diakses beragam siswa.<\/td><td>Informasi disajikan melalui teks, audio, visual; siswa dapat menunjukkan pemahaman dengan beberapa cara.<\/td><\/tr><\/table><\/div><p>Kebutuhan dukungan tidak boleh disimpulkan dari dugaan guru. Hindari diagnosis sendiri. Fokus pada hambatan belajar, kekuatan siswa, akomodasi yang diperlukan, serta kolaborasi dengan pihak yang berwenang.<\/p>"}, {"g": "II", "t": "13. Kurikulum Merdeka: konsep dan prinsip", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Kurikulum Merdeka memberi ruang bagi pembelajaran yang berfokus pada materi esensial, pengembangan kompetensi, fleksibilitas, dan kebutuhan peserta didik.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengarahkan guru merancang pembelajaran yang relevan, mendalam, dan sesuai konteks satuan pendidikan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Pahami CP dan fase; analisis kebutuhan siswa; susun tujuan dan alur; rancang asesmen serta pengalaman belajar; refleksikan hasil.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Guru Informatika kelas VIII menganalisis CP fase D, memilih elemen yang relevan, lalu menyusun rangkaian tujuan tentang berpikir komputasional dan analisis data.<\/p><\/div><p>Dalam implementasi, periksa panduan dan regulasi kurikulum terbaru dari kementerian serta kebijakan satuan pendidikan. Istilah dan struktur program dapat diperbarui.<\/p>"}, {"g": "II", "t": "14. Capaian Pembelajaran (CP)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>CP adalah kompetensi pembelajaran yang perlu dicapai peserta didik pada akhir fase.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Menjadi acuan untuk merancang tujuan, alur, kegiatan, dan asesmen.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Baca CP secara utuh; tandai kompetensi dan lingkup materi; perhatikan fase dan elemen; tentukan bagian yang relevan untuk unit pembelajaran.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Dari CP Informatika fase D, guru mengidentifikasi kompetensi terkait berpikir komputasional, lalu memecahnya menjadi tujuan yang lebih spesifik.<\/p><\/div>"}, {"g": "II", "t": "15. Tujuan Pembelajaran (TP)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>TP merupakan rumusan kompetensi dan lingkup materi yang diharapkan dikuasai siswa dalam satu atau lebih kegiatan pembelajaran.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memberi arah yang jelas tentang kemampuan yang akan dipelajari dan dinilai.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tentukan kompetensi; tentukan konteks/lingkup materi; pilih kata kerja yang dapat diamati; pastikan tujuan realistis dan selaras dengan CP.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Setelah pembelajaran, peserta didik mampu menyusun algoritma sederhana untuk menyelesaikan masalah sehari-hari menggunakan urutan instruksi yang logis.<\/p><\/div><p>Rumusan TP yang baik menjelaskan kemampuan yang diharapkan dan konteks materi. KKO membantu memperjelas perilaku teramati, tetapi tidak perlu memaksakan format ABCD jika tidak diwajibkan oleh format yang digunakan.<\/p>"}, {"g": "II", "t": "16. Alur Tujuan Pembelajaran (ATP)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>ATP adalah rangkaian tujuan pembelajaran yang disusun secara logis dan sistematis untuk membantu peserta didik mencapai CP pada akhir fase.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Menjaga urutan pembelajaran, hubungan prasyarat, dan kesinambungan kompetensi.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Susun TP dari prasyarat menuju kemampuan lebih kompleks; cek keterkaitan antartujuan; perkirakan waktu; tinjau kembali berdasarkan kebutuhan siswa.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Urutan unit algoritma: memahami instruksi → mengenali pola → menyusun urutan → menggunakan percabangan → menguji dan memperbaiki algoritma.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Istilah<\/b><\/th><th><b>Pertanyaan kunci<\/b><\/th><th><b>Analogi<\/b><\/th><\/tr><tr><td>CP<\/td><td>Kompetensi apa yang diharapkan pada akhir fase?<\/td><td>Tujuan akhir perjalanan.<\/td><\/tr><tr><td>TP<\/td><td>Kemampuan apa yang akan dicapai pada pembelajaran tertentu?<\/td><td>Titik-titik tujuan antara.<\/td><\/tr><tr><td>ATP<\/td><td>Bagaimana urutan tujuan agar sampai ke CP?<\/td><td>Rute perjalanan.<\/td><\/tr><\/table><\/div>"}, {"g": "II", "t": "17. Modul ajar/perencanaan pembelajaran", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Modul ajar adalah salah satu bentuk perencanaan pembelajaran yang memuat tujuan, langkah pembelajaran, asesmen, dan sumber/dukungan yang diperlukan. Format rinci mengikuti panduan yang berlaku.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu guru melaksanakan pembelajaran secara terarah sekaligus fleksibel.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Mulai dari CP/TP; kenali siswa; tentukan asesmen; pilih model dan media; susun kegiatan pendahuluan, inti, penutup; siapkan diferensiasi dan tindak lanjut.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Modul ajar algoritma memuat tujuan, pertanyaan pemantik, aktivitas kartu instruksi, diskusi kelompok, tugas membuat flowchart, rubrik, dan refleksi.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Komponen perencanaan<\/b><\/th><th><b>Isi yang dapat dicantumkan<\/b><\/th><\/tr><tr><td>Identitas dan konteks<\/td><td>Satuan pendidikan, mata pelajaran, fase/kelas, alokasi waktu.<\/td><\/tr><tr><td>Kompetensi awal<\/td><td>Pengetahuan/keterampilan prasyarat siswa.<\/td><\/tr><tr><td>Tujuan pembelajaran<\/td><td>Kemampuan yang diharapkan.<\/td><\/tr><tr><td>Pemahaman bermakna<\/td><td>Gagasan penting yang dibawa ke konteks lain.<\/td><\/tr><tr><td>Pertanyaan pemantik<\/td><td>Pertanyaan terbuka yang membangkitkan rasa ingin tahu.<\/td><\/tr><tr><td>Langkah pembelajaran<\/td><td>Pendahuluan, inti, penutup, aktivitas guru dan siswa.<\/td><\/tr><tr><td>Asesmen<\/td><td>Teknik, instrumen, kriteria, dan bukti belajar.<\/td><\/tr><tr><td>Dukungan belajar<\/td><td>Diferensiasi, akomodasi, remedial, pengayaan.<\/td><\/tr><tr><td>Media dan sumber<\/td><td>Bahan ajar, perangkat, LKPD, teknologi.<\/td><\/tr><tr><td>Refleksi<\/td><td>Pertanyaan refleksi untuk guru dan siswa.<\/td><\/tr><\/table><\/div>"}, {"g": "II", "t": "18. Understanding by Design (UbD)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>UbD atau Backward Design adalah kerangka perencanaan yang dimulai dengan menetapkan hasil belajar yang diinginkan, menentukan bukti pencapaian, kemudian merancang kegiatan belajar.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memastikan kegiatan dan asesmen benar-benar mendukung tujuan, bukan sekadar aktivitas yang menarik.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tahap 1: tentukan hasil/tujuan dan pemahaman esensial. Tahap 2: tentukan bukti asesmen dan kriteria. Tahap 3: rancang pengalaman belajar yang menyiapkan siswa menghasilkan bukti tersebut.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Tujuan: siswa mampu menganalisis data. Bukti: siswa membuat grafik dan menjelaskan kesimpulan. Aktivitas: membaca tabel, memilih grafik, mengolah data, lalu mempresentasikan temuan.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Tahap UbD<\/b><\/th><th><b>Pertanyaan<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>1. Desired Results<\/td><td>Apa yang harus dipahami dan dapat dilakukan siswa?<\/td><td>Siswa mampu menjelaskan dan menggunakan algoritma percabangan.<\/td><\/tr><tr><td>2. Assessment Evidence<\/td><td>Bukti apa yang menunjukkan tujuan tercapai?<\/td><td>Siswa menyelesaikan studi kasus dan menghasilkan flowchart dengan rubrik.<\/td><\/tr><tr><td>3. Learning Plan<\/td><td>Pengalaman belajar apa yang menyiapkan siswa?<\/td><td>Simulasi, analisis contoh, latihan terbimbing, proyek mini, refleksi.<\/td><\/tr><\/table><\/div><p>UbD bukan berarti guru mengabaikan proses. Justru proses dipilih secara sengaja agar siswa siap menunjukkan pemahaman.<\/p>"}, {"g": "II", "t": "19. Model Project Based Learning (PjBL)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>PjBL adalah model pembelajaran yang mengorganisasi belajar melalui proyek untuk menghasilkan produk, kinerja, atau solusi dalam rentang waktu tertentu.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengembangkan pemecahan masalah, kolaborasi, kreativitas, komunikasi, dan penerapan pengetahuan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Mulai dengan pertanyaan mendasar; rancang proyek dan kriteria; susun jadwal; pantau proses; uji/presentasikan hasil; refleksikan pengalaman.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Kelompok siswa membuat infografik keamanan digital berdasarkan hasil survei sederhana. Mereka merencanakan produk, mengolah data, membuat desain, mempresentasikan, dan merevisi.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Tahap PjBL<\/b><\/th><th><b>Aktivitas guru/siswa<\/b><\/th><\/tr><tr><td>Pertanyaan mendasar<\/td><td>Menentukan masalah atau pertanyaan pemicu proyek.<\/td><\/tr><tr><td>Desain proyek<\/td><td>Menentukan produk, kriteria keberhasilan, alat, dan pembagian peran.<\/td><\/tr><tr><td>Jadwal<\/td><td>Menetapkan tahapan dan tenggat.<\/td><\/tr><tr><td>Monitoring<\/td><td>Guru memberi umpan balik dan memantau kemajuan.<\/td><\/tr><tr><td>Uji hasil<\/td><td>Produk dipresentasikan atau diuji berdasarkan kriteria.<\/td><\/tr><tr><td>Evaluasi pengalaman<\/td><td>Siswa dan guru merefleksikan proses serta hasil.<\/td><\/tr><\/table><\/div>"}, {"g": "II", "t": "20. Model Problem Based Learning (PBL)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>PBL memulai pembelajaran dari masalah autentik atau kontekstual yang perlu diselidiki dan dipecahkan oleh peserta didik.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengembangkan penalaran, penyelidikan, kolaborasi, dan kemampuan menghubungkan konsep dengan masalah.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Orientasikan siswa pada masalah; organisasikan kelompok; bimbing penyelidikan; minta siswa menyusun dan menyajikan solusi; analisis proses pemecahan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa diminta mencari penyebab komputer laboratorium lambat. Mereka mengumpulkan informasi, memilah kemungkinan penyebab, menyusun langkah pemeriksaan, dan mempresentasikan solusi.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Tahap PBL<\/b><\/th><th><b>Contoh tindakan<\/b><\/th><\/tr><tr><td>Orientasi masalah<\/td><td>Guru menyajikan kasus nyata dan pertanyaan kunci.<\/td><\/tr><tr><td>Organisasi belajar<\/td><td>Siswa membentuk kelompok dan membagi tugas.<\/td><\/tr><tr><td>Penyelidikan<\/td><td>Siswa mencari data, menguji dugaan, dan berdiskusi.<\/td><\/tr><tr><td>Pengembangan/penyajian solusi<\/td><td>Kelompok menyampaikan solusi dengan bukti.<\/td><\/tr><tr><td>Analisis dan evaluasi<\/td><td>Kelas menilai kelogisan solusi dan proses.<\/td><\/tr><\/table><\/div>"}, {"g": "II", "t": "21. Model Discovery Learning", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Discovery Learning memberi kesempatan kepada siswa menemukan konsep atau prinsip melalui pengamatan, pengumpulan dan pengolahan informasi, serta penarikan kesimpulan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengembangkan rasa ingin tahu, pemahaman konsep, dan kemampuan menemukan pola.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Berikan stimulus; bantu siswa merumuskan masalah; kumpulkan data; olah data; verifikasi; simpulkan konsep.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Guru menampilkan beberapa urutan instruksi, termasuk yang salah. Siswa membandingkan, menemukan pola urutan yang benar, menguji, lalu menyimpulkan ciri algoritma.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Tahap<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Stimulation<\/td><td>Menampilkan teka-teki atau contoh fenomena.<\/td><\/tr><tr><td>Problem statement<\/td><td>Siswa merumuskan pertanyaan/dugaan.<\/td><\/tr><tr><td>Data collection<\/td><td>Mengumpulkan contoh atau informasi.<\/td><\/tr><tr><td>Data processing<\/td><td>Mengelompokkan dan membandingkan data.<\/td><\/tr><tr><td>Verification<\/td><td>Menguji dugaan dengan contoh lain.<\/td><\/tr><tr><td>Generalization<\/td><td>Menyimpulkan prinsip atau konsep.<\/td><\/tr><\/table><\/div><p>PjBL berorientasi pada proyek/produk; PBL berorientasi pada penyelidikan dan pemecahan masalah; Discovery berorientasi pada penemuan konsep. Ketiganya dapat saling beririsan, tetapi fokus dan sintaksnya berbeda.<\/p>"}, {"g": "II", "t": "22. TPACK", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>TPACK adalah kerangka pengetahuan guru untuk mengintegrasikan pengetahuan materi (CK), pedagogi (PK), dan teknologi (TK) secara tepat.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu guru memilih teknologi berdasarkan tujuan dan cara belajar, bukan menggunakan aplikasi hanya karena menarik.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tentukan materi; pilih pendekatan mengajar; identifikasi teknologi yang benar-benar membantu; pastikan aksesibilitas; evaluasi dampaknya.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Untuk mengajarkan visualisasi data, guru memahami konsep grafik (CK), menggunakan diskusi dan inquiry (PK), serta memakai spreadsheet untuk membuat grafik (TK). Ketiganya terintegrasi menjadi TPACK.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Komponen<\/b><\/th><th><b>Pengertian<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>CK<\/td><td>Content Knowledge: pengetahuan materi.<\/td><td>Memahami konsep data, algoritma, jaringan.<\/td><\/tr><tr><td>PK<\/td><td>Pedagogical Knowledge: pengetahuan pedagogi.<\/td><td>Memahami diskusi, PBL, diferensiasi, asesmen.<\/td><\/tr><tr><td>TK<\/td><td>Technological Knowledge: pengetahuan teknologi.<\/td><td>Mengoperasikan LMS, spreadsheet, simulasi.<\/td><\/tr><tr><td>PCK<\/td><td>Pedagogi untuk mengajarkan konten tertentu.<\/td><td>Menggunakan analogi untuk menjelaskan algoritma.<\/td><\/tr><tr><td>TCK<\/td><td>Teknologi yang merepresentasikan/mengubah konten.<\/td><td>Simulasi untuk memperlihatkan alur program.<\/td><\/tr><tr><td>TPK<\/td><td>Teknologi yang mendukung strategi pedagogis.<\/td><td>LMS untuk diskusi dan umpan balik.<\/td><\/tr><tr><td>TPACK<\/td><td>Integrasi konten, pedagogi, dan teknologi.<\/td><td>Mengajar analisis data dengan inquiry dan spreadsheet.<\/td><\/tr><\/table><\/div>"}, {"g": "II", "t": "23. Taksonomi Bloom revisi, KKO, LOTS dan HOTS", "h": "<p>Taksonomi Bloom revisi mengelompokkan proses kognitif dari mengingat hingga mencipta. KKO (kata kerja operasional) membantu guru merumuskan tujuan dan indikator yang dapat diamati.<\/p><div class=\"wrap\"><table><tr><th><b>Level<\/b><\/th><th><b>Proses kognitif<\/b><\/th><th><b>Contoh KKO<\/b><\/th><th><b>Contoh tugas Informatika<\/b><\/th><\/tr><tr><td>C1 Mengingat<\/td><td>Mengambil kembali informasi.<\/td><td>Menyebutkan, mengidentifikasi.<\/td><td>Menyebutkan komponen komputer.<\/td><\/tr><tr><td>C2 Memahami<\/td><td>Menjelaskan makna.<\/td><td>Menjelaskan, mengklasifikasi.<\/td><td>Menjelaskan fungsi RAM.<\/td><\/tr><tr><td>C3 Menerapkan<\/td><td>Menggunakan prosedur.<\/td><td>Menggunakan, menghitung, menjalankan.<\/td><td>Menerapkan langkah algoritma.<\/td><\/tr><tr><td>C4 Menganalisis<\/td><td>Mengurai hubungan/pola.<\/td><td>Membandingkan, mengelompokkan, menganalisis.<\/td><td>Menganalisis kesalahan flowchart.<\/td><\/tr><tr><td>C5 Mengevaluasi<\/td><td>Memberi penilaian berdasar kriteria.<\/td><td>Menilai, mengkritisi, memeriksa.<\/td><td>Menilai efisiensi dua algoritma.<\/td><\/tr><tr><td>C6 Mencipta<\/td><td>Menghasilkan rancangan/produk.<\/td><td>Merancang, membuat, mengembangkan.<\/td><td>Membuat solusi algoritmik.<\/td><\/tr><\/table><\/div><p>LOTS umumnya mencakup C1–C3 dan HOTS sering merujuk C4–C6. Namun, tingkat berpikir tidak ditentukan oleh kata kerja saja; konteks, kompleksitas tugas, dan proses berpikir yang diminta juga penting.<\/p>"}, {"g": "II", "t": "24. Literasi dan numerasi", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Literasi adalah kemampuan memahami, menggunakan, mengevaluasi, dan merefleksikan informasi; numerasi adalah kemampuan menggunakan konsep, prosedur, fakta, dan alat matematika untuk memecahkan masalah dalam berbagai konteks.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membekali siswa untuk mengambil keputusan dan menyelesaikan persoalan kehidupan nyata.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Gunakan teks/data autentik; minta siswa menafsirkan informasi; gunakan tabel, grafik, angka, perbandingan, dan alasan; minta kesimpulan berbasis bukti.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Dalam Informatika, siswa membaca artikel keamanan digital (literasi), mengolah hasil survei dalam tabel dan persentase (numerasi), lalu menyajikan rekomendasi.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Ruang lingkup<\/b><\/th><th><b>Contoh penerapan<\/b><\/th><\/tr><tr><td>Literasi membaca<\/td><td>Menemukan gagasan utama dan mengevaluasi sumber.<\/td><\/tr><tr><td>Literasi digital/informasi<\/td><td>Memeriksa kredibilitas situs dan mengenali hoaks.<\/td><\/tr><tr><td>Literasi sains<\/td><td>Menafsirkan bukti dan penjelasan fenomena.<\/td><\/tr><tr><td>Literasi budaya/kewargaan<\/td><td>Memahami keberagaman dan tanggung jawab warga.<\/td><\/tr><tr><td>Numerasi bilangan<\/td><td>Menghitung persentase penggunaan perangkat.<\/td><\/tr><tr><td>Numerasi data<\/td><td>Membaca tabel, grafik, rata-rata, dan pola.<\/td><\/tr><tr><td>Numerasi geometri/pengukuran<\/td><td>Mengukur ruang laboratorium atau menghitung kebutuhan kabel.<\/td><\/tr><tr><td>Numerasi aljabar<\/td><td>Mengenali pola dan hubungan variabel.<\/td><\/tr><\/table><\/div>"}, {"g": "II", "t": "25. Pembelajaran mendalam", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Pembelajaran mendalam menekankan proses belajar yang berkesadaran, bermakna, dan menggembirakan serta memberi pengalaman memahami, mengaplikasi, dan merefleksi.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mendorong pemahaman yang bertahan, transfer pengetahuan, dan keterlibatan siswa.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Jelaskan tujuan; hubungkan konsep dengan konteks nyata; beri kesempatan menerapkan; fasilitasi refleksi; ciptakan suasana aman dan menantang.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa mempelajari keamanan kata sandi, menganalisis risiko, membuat panduan keamanan untuk keluarga, lalu merefleksikan perubahan kebiasaan digital.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Prinsip<\/b><\/th><th><b>Makna<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Berkesadaran (mindful)<\/td><td>Siswa memahami tujuan dan mengatur proses belajar.<\/td><td>Siswa menetapkan target dan memantau kemajuannya.<\/td><\/tr><tr><td>Bermakna (meaningful)<\/td><td>Materi terhubung dengan konteks nyata.<\/td><td>Belajar data dari masalah lingkungan sekolah.<\/td><\/tr><tr><td>Menggembirakan (joyful)<\/td><td>Suasana positif, aman, menantang, dan memotivasi.<\/td><td>Permainan edukatif yang tetap mengukur tujuan.<\/td><\/tr><\/table><\/div>"}, {"g": "III", "t": "26. Perbedaan pengukuran, penilaian, asesmen, dan evaluasi", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Pengukuran menghasilkan informasi kuantitatif; penilaian menafsirkan bukti berdasarkan kriteria; asesmen mengumpulkan dan menggunakan bukti belajar; evaluasi menilai mutu atau keberhasilan program/proses secara lebih luas.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mencegah guru menyamakan angka tes dengan keseluruhan kemampuan siswa.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Kumpulkan beragam bukti; tafsirkan dengan kriteria; gunakan hasil untuk keputusan pembelajaran; evaluasi apakah strategi dan program efektif.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Tes menghasilkan skor 80 (pengukuran); guru menafsirkan kompetensi yang sudah dikuasai (penilaian); mengumpulkan kuis, observasi, dan proyek (asesmen); menilai efektivitas unit pembelajaran (evaluasi).<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Istilah<\/b><\/th><th><b>Pertanyaan<\/b><\/th><\/tr><tr><td>Pengukuran<\/td><td>Berapa skor atau jumlah yang diperoleh?<\/td><\/tr><tr><td>Penilaian<\/td><td>Apa makna skor/bukti tersebut berdasarkan kriteria?<\/td><\/tr><tr><td>Asesmen<\/td><td>Bukti apa yang dikumpulkan dan bagaimana digunakan untuk mendukung belajar?<\/td><\/tr><tr><td>Evaluasi<\/td><td>Seberapa baik proses/program mencapai tujuan dan apa keputusan perbaikannya?<\/td><\/tr><\/table><\/div>"}, {"g": "III", "t": "27. Asesmen diagnostik kognitif", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Asesmen diagnostik kognitif memetakan pengetahuan awal, kemampuan prasyarat, dan miskonsepsi sebelum pembelajaran atau ketika diperlukan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Menentukan titik awal pembelajaran dan dukungan yang dibutuhkan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tentukan prasyarat; buat pertanyaan singkat; analisis pola jawaban; kelompokkan kebutuhan; rancang tindak lanjut; lakukan asesmen ulang bila perlu.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Sebelum materi percabangan, guru memberi soal urutan instruksi dan logika kondisi. Hasil menunjukkan sebagian siswa belum memahami urutan, sehingga guru menguatkan prasyarat terlebih dahulu.<\/p><\/div>"}, {"g": "III", "t": "28. Asesmen diagnostik nonkognitif", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Asesmen diagnostik nonkognitif menggali kondisi, minat, motivasi, rasa aman, kebiasaan, akses, dan faktor lingkungan yang dapat memengaruhi pembelajaran.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu guru menyiapkan dukungan dan lingkungan belajar yang sesuai.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Gunakan angket singkat, percakapan, observasi, atau refleksi; jaga kerahasiaan; tanyakan hal yang relevan; jangan membuat diagnosis klinis.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Guru mengetahui beberapa siswa berbagi perangkat di rumah. Guru menyediakan waktu praktik di sekolah dan alternatif tugas yang dapat dikerjakan tanpa koneksi internet.<\/p><\/div><p>Contoh pertanyaan: &#x27;Bagian pembelajaran apa yang paling membuatmu tertarik?&#x27;, &#x27;Apa yang biasanya membuatmu kesulitan mengerjakan tugas?&#x27;, &#x27;Apakah kamu memiliki akses perangkat dan internet untuk kegiatan ini?&#x27;<\/p>"}, {"g": "III", "t": "29. Asesmen formatif", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Asesmen formatif adalah proses mengumpulkan dan menggunakan bukti selama pembelajaran untuk mengetahui posisi belajar siswa dan menentukan langkah berikutnya.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memperbaiki proses belajar dan mengajar sebelum pembelajaran berakhir.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tetapkan tujuan dan kriteria; ajukan pertanyaan/aktivitas; amati bukti; berikan umpan balik; sesuaikan pengajaran; beri kesempatan memperbaiki.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Di tengah pelajaran flowchart, guru meminta siswa mengerjakan exit ticket satu soal. Banyak siswa salah pada simbol keputusan, sehingga guru memberi contoh tambahan pada pertemuan berikutnya.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Teknik<\/b><\/th><th><b>Kegunaan<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Tanya jawab<\/td><td>Memeriksa pemahaman seketika.<\/td><td>Mengapa langkah ini ditempatkan sebelum percabangan?<\/td><\/tr><tr><td>Kuis singkat<\/td><td>Mendeteksi miskonsepsi.<\/td><td>Tiga soal tentang simbol flowchart.<\/td><\/tr><tr><td>Exit ticket<\/td><td>Mengetahui pemahaman di akhir sesi.<\/td><td>Tuliskan satu konsep yang dipahami dan satu yang membingungkan.<\/td><\/tr><tr><td>Observasi<\/td><td>Melihat proses dan keterlibatan.<\/td><td>Checklist kontribusi saat diskusi.<\/td><\/tr><tr><td>Peer assessment<\/td><td>Belajar memberi masukan berdasarkan kriteria.<\/td><td>Kelompok saling meninjau flowchart.<\/td><\/tr><tr><td>Self-assessment<\/td><td>Melatih refleksi dan regulasi diri.<\/td><td>Siswa menilai kemajuan terhadap tujuan.<\/td><\/tr><\/table><\/div>"}, {"g": "III", "t": "30. Asesmen sumatif", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Asesmen sumatif digunakan untuk menilai pencapaian hasil belajar pada akhir suatu lingkup materi, unit, atau periode sesuai perencanaan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memberi gambaran capaian kompetensi dan menjadi salah satu dasar pelaporan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Selaraskan dengan tujuan; tentukan bukti yang tepat; buat kisi-kisi; siapkan instrumen dan rubrik; laksanakan secara adil; analisis hasil.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Di akhir unit algoritma, siswa menyelesaikan studi kasus dan menyerahkan flowchart serta penjelasan tertulis yang dinilai dengan rubrik.<\/p><\/div><p>Bentuknya dapat berupa tes tertulis/lisan, praktik, proyek, portofolio, produk, atau kinerja. Sumatif tidak harus selalu berupa ujian pilihan ganda.<\/p>"}, {"g": "III", "t": "31. Kisi-kisi dan konstruksi soal", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Kisi-kisi adalah rancangan yang menghubungkan tujuan/kompetensi, materi, indikator soal, bentuk soal, dan tingkat kognitif.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Menjaga keterwakilan materi dan keselarasan instrumen dengan tujuan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Petakan tujuan; pilih materi; rumuskan indikator terukur; tentukan bentuk soal; tentukan level kognitif; tulis soal dan kunci/rubrik; telaah bahasa serta keadilan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Tujuan: siswa menganalisis kesalahan algoritma. Indikator: diberikan flowchart yang mengandung satu kesalahan, siswa dapat mengidentifikasi dan menjelaskan perbaikannya.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Komponen kisi-kisi<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Tujuan<\/td><td>Siswa mampu menganalisis alur percabangan.<\/td><\/tr><tr><td>Materi<\/td><td>Flowchart percabangan.<\/td><\/tr><tr><td>Indikator soal<\/td><td>Diberikan flowchart, siswa menemukan kondisi yang keliru.<\/td><\/tr><tr><td>Level kognitif<\/td><td>C4 — menganalisis.<\/td><\/tr><tr><td>Bentuk soal<\/td><td>Uraian/studi kasus.<\/td><\/tr><tr><td>Pedoman penskoran<\/td><td>Ketepatan identifikasi, alasan, dan perbaikan.<\/td><\/tr><\/table><\/div>"}, {"g": "III", "t": "32. KKTP", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Kriteria Ketercapaian Tujuan Pembelajaran adalah kriteria atau deskripsi yang digunakan untuk melihat apakah tujuan pembelajaran telah dicapai.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memberi acuan yang transparan untuk menafsirkan bukti belajar dan menentukan tindak lanjut.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tentukan tujuan; uraikan bukti/indikator penting; deskripsikan tingkat kualitas atau kriteria; gunakan hasil asesmen untuk menentukan langkah selanjutnya.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Untuk tujuan membuat flowchart, kriteria dapat mencakup ketepatan simbol, urutan logika, kelengkapan kondisi, dan kemampuan menjelaskan alur.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Aspek<\/b><\/th><th><b>Belum berkembang<\/b><\/th><th><b>Berkembang<\/b><\/th><th><b>Cakap<\/b><\/th><th><b>Mahir<\/b><\/th><\/tr><tr><td>Simbol<\/td><td>Banyak simbol tidak sesuai.<\/td><td>Sebagian simbol tepat.<\/td><td>Hampir semua simbol tepat.<\/td><td>Semua simbol tepat dan konsisten.<\/td><\/tr><tr><td>Logika<\/td><td>Urutan belum dapat diikuti.<\/td><td>Ada bagian alur yang keliru.<\/td><td>Alur logis dengan kesalahan kecil.<\/td><td>Alur tepat dan efisien.<\/td><\/tr><tr><td>Penjelasan<\/td><td>Belum mampu menjelaskan.<\/td><td>Penjelasan masih terbatas.<\/td><td>Penjelasan cukup runtut.<\/td><td>Penjelasan jelas dan mampu memberi alasan.<\/td><\/tr><\/table><\/div><p>Contoh rubrik di atas adalah salah satu cara menyusun kriteria, bukan format wajib. Hindari menganggap satu rentang angka universal berlaku untuk semua tujuan dan satuan pendidikan.<\/p>"}, {"g": "III", "t": "33. Rubrik analitik dan holistik", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Rubrik adalah pedoman yang memuat kriteria dan deskripsi tingkat kualitas kinerja atau produk.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membuat penilaian lebih transparan, konsisten, dan membantu siswa memahami kualitas yang diharapkan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Pilih kriteria yang terkait tujuan; tulis deskripsi setiap tingkat; bagikan sebelum tugas; gunakan bukti secara konsisten.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Proyek aplikasi sederhana dinilai dari fungsi, logika, antarmuka, dan presentasi secara terpisah menggunakan rubrik analitik.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Jenis<\/b><\/th><th><b>Karakteristik<\/b><\/th><th><b>Kapan sesuai<\/b><\/th><\/tr><tr><td>Analitik<\/td><td>Setiap kriteria dinilai terpisah; hasil rinci per aspek.<\/td><td>Saat guru perlu mengetahui aspek spesifik yang kuat/perlu diperbaiki.<\/td><\/tr><tr><td>Holistik<\/td><td>Kualitas keseluruhan diberi satu penilaian/deskripsi.<\/td><td>Saat penilaian menyeluruh lebih penting dan waktu terbatas.<\/td><\/tr><\/table><\/div>"}, {"g": "III", "t": "34. Umpan balik konstruktif", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Umpan balik konstruktif adalah informasi spesifik tentang posisi kinerja siswa terhadap tujuan dan langkah yang dapat dilakukan untuk memperbaikinya.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membantu siswa memahami apa yang sudah baik, apa yang perlu ditingkatkan, dan bagaimana melangkah.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Rujuk kriteria; sebutkan bukti yang terlihat; fokus pada tugas/proses, bukan label pribadi; berikan saran yang dapat dilakukan; beri kesempatan revisi.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Daripada mengatakan &#x27;kamu tidak teliti&#x27;, guru mengatakan &#x27;kondisi pada simbol keputusan belum memiliki cabang Ya dan Tidak. Tambahkan kedua cabang, lalu uji alurnya dengan dua contoh input&#x27;.<\/p><\/div><p>Pola praktis: Apresiasi bukti yang tepat → tunjukkan kesenjangan terhadap kriteria → berikan langkah perbaikan → beri kesempatan mencoba kembali.<\/p>"}, {"g": "III", "t": "35. Analisis butir soal: tingkat kesukaran", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Indeks kesukaran menunjukkan proporsi peserta yang menjawab benar pada suatu butir soal. Untuk soal objektif, rumus sederhana P = B/JS.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengetahui apakah soal terlalu mudah, sedang, atau sukar bagi kelompok yang diuji.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Hitung jumlah jawaban benar; bagi dengan jumlah peserta; tafsirkan sesuai pedoman analisis yang digunakan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Jika 24 dari 30 siswa menjawab benar, P = 24/30 = 0,80. Butir tergolong mudah menurut klasifikasi umum.<\/p><\/div><p>Klasifikasi yang sering digunakan: P 0,00–0,30 sukar; 0,31–0,70 sedang; 0,71–1,00 mudah. Batas dapat berbeda menurut pedoman atau konteks.<\/p>"}, {"g": "III", "t": "36. Analisis daya pembeda", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Daya pembeda menunjukkan kemampuan butir membedakan peserta dengan penguasaan lebih tinggi dan lebih rendah.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengetahui apakah soal mampu membedakan tingkat penguasaan secara memadai.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tentukan kelompok atas dan bawah sesuai metode; hitung proporsi benar masing-masing; hitung D = PA − PB; telaah butir dengan hasil rendah atau negatif.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Jika proporsi benar kelompok atas 0,80 dan kelompok bawah 0,30, maka D = 0,50, yang menunjukkan daya pembeda baik menurut klasifikasi umum.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Indeks D (panduan umum)<\/b><\/th><th><b>Interpretasi<\/b><\/th><\/tr><tr><td>0,00–0,20<\/td><td>Jelek; perlu ditelaah.<\/td><\/tr><tr><td>0,21–0,40<\/td><td>Cukup.<\/td><\/tr><tr><td>0,41–0,70<\/td><td>Baik.<\/td><\/tr><tr><td>0,71–1,00<\/td><td>Sangat baik.<\/td><\/tr><tr><td>Negatif<\/td><td>Perlu pemeriksaan serius terhadap kunci, redaksi, materi, atau data.<\/td><\/tr><\/table><\/div>"}, {"g": "III", "t": "37. Validitas, reliabilitas, dan pengecoh", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Validitas berkaitan dengan ketepatan interpretasi hasil untuk tujuan penggunaan; reliabilitas berkaitan dengan konsistensi pengukuran; analisis pengecoh melihat fungsi opsi salah pada pilihan ganda.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memastikan instrumen layak digunakan dan hasilnya dapat ditafsirkan secara bertanggung jawab.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Telaah kesesuaian isi dengan tujuan; uji coba bila memungkinkan; analisis konsistensi; periksa opsi yang tidak dipilih atau justru menarik siswa berkemampuan tinggi; revisi.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Jika siswa yang menguasai materi banyak memilih opsi B padahal kunci A, guru memeriksa apakah kunci salah atau redaksi soal ambigu.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Konsep<\/b><\/th><th><b>Pertanyaan utama<\/b><\/th><th><b>Contoh pemeriksaan<\/b><\/th><\/tr><tr><td>Validitas isi<\/td><td>Apakah soal mewakili tujuan dan materi?<\/td><td>Kisi-kisi dan telaah ahli/rekan.<\/td><\/tr><tr><td>Validitas konstruk<\/td><td>Apakah instrumen merepresentasikan kemampuan yang dimaksud?<\/td><td>Butir benar-benar mengukur penalaran, bukan sekadar membaca rumit.<\/td><\/tr><tr><td>Validitas empiris<\/td><td>Bagaimana hubungan skor butir dengan ukuran yang relevan?<\/td><td>Analisis korelasi sesuai metode.<\/td><\/tr><tr><td>Reliabilitas<\/td><td>Apakah hasil relatif konsisten?<\/td><td>Koefisien konsistensi internal, misalnya Cronbach&#x27;s Alpha untuk data yang sesuai.<\/td><\/tr><tr><td>Pengecoh<\/td><td>Apakah opsi salah berfungsi?<\/td><td>Opsi tidak dipilih siapa pun perlu ditelaah.<\/td><\/tr><\/table><\/div><p>Koefisien reliabilitas tidak boleh ditafsirkan sendirian sebagai bukti bahwa tes valid. Pilihan teknik statistik harus sesuai jenis data dan instrumen.<\/p>"}, {"g": "III", "t": "38. Pengolahan nilai", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Pengolahan nilai adalah proses mengubah bukti asesmen menjadi informasi yang dapat ditafsirkan berdasarkan kriteria dan tujuan pembelajaran.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Menyajikan capaian secara akurat dan menjadi dasar tindak lanjut.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Periksa kelengkapan bukti; gunakan rubrik/kunci; hitung skor; interpretasikan terhadap kriteria; dokumentasikan; hindari pembobotan tanpa alasan yang jelas.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa memperoleh 18 dari 20 poin. Jika skala 100 digunakan, nilai = 18/20 × 100 = 90. Namun, guru tetap melihat kriteria kompetensi yang dikuasai, bukan hanya angka.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Rumus<\/b><\/th><th><b>Kegunaan<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Nilai = skor perolehan ÷ skor maksimal × 100<\/td><td>Konversi skor ke skala 100.<\/td><td>18/20 × 100 = 90.<\/td><\/tr><tr><td>Rata-rata = jumlah nilai ÷ banyak data<\/td><td>Ringkasan beberapa skor sejenis.<\/td><td>(80+90+70)/3 = 80.<\/td><\/tr><tr><td>Nilai berbobot = Σ(skor komponen × bobot)<\/td><td>Jika bobot ditetapkan secara transparan dan relevan.<\/td><td>Tugas 20%, praktik 30%, proyek 20%, sumatif 30%.<\/td><\/tr><\/table><\/div><p>Jangan merata-ratakan skor yang mengukur kompetensi berbeda tanpa mempertimbangkan tujuan dan kebijakan penilaian. Nilai angka perlu disertai interpretasi capaian.<\/p>"}, {"g": "III", "t": "39. Rapor dan pelaporan hasil belajar", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Rapor adalah laporan perkembangan dan capaian belajar peserta didik dalam periode tertentu, yang disampaikan kepada peserta didik dan orang tua/wali.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memberikan gambaran yang jelas, adil, dan berguna tentang kekuatan, perkembangan, serta area yang perlu didukung.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Gunakan bukti asesmen yang memadai; tulis deskripsi spesifik dan mudah dipahami; hindari label; jelaskan tindak lanjut; jaga kerahasiaan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Deskripsi: &#x27;Mampu menyusun algoritma berurutan dan menjelaskan alurnya. Perlu berlatih menguji kondisi percabangan pada beberapa kemungkinan input.&#x27;<\/p><\/div><p>Isi dan format rapor mengikuti kebijakan kurikulum serta sistem pelaporan satuan pendidikan yang berlaku.<\/p>"}, {"g": "III", "t": "40. Remedial dan pengayaan", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Remedial adalah dukungan pembelajaran untuk membantu siswa mencapai tujuan yang belum tercapai; pengayaan memberi tantangan lanjutan kepada siswa yang telah mencapai tujuan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memastikan semua siswa memperoleh tindak lanjut sesuai bukti belajar.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Analisis aspek yang belum dikuasai; pilih strategi yang berbeda atau dukungan tambahan; asesmen kembali. Untuk pengayaan, berikan kedalaman, penerapan, atau tantangan baru.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa yang belum memahami percabangan berlatih dengan kartu kondisi dan contoh terbimbing; siswa yang sudah mahir merancang algoritma dengan beberapa kondisi dan menguji kasus tepi.<\/p><\/div>"}, {"g": "IV", "t": "41. Refleksi pembelajaran", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Refleksi adalah proses meninjau pengalaman, bukti, keputusan, dan dampak pembelajaran untuk menentukan perbaikan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Meningkatkan kualitas praktik mengajar berdasarkan bukti, bukan sekadar perasaan atau asumsi.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Catat tujuan dan hasil; kumpulkan bukti; identifikasi yang berhasil/tidak; cari penyebab; susun tindakan perbaikan; uji pada pembelajaran berikutnya.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Guru melihat hanya 40% siswa menyelesaikan tugas algoritma. Ia menelaah instruksi, waktu, dan prasyarat, lalu menambahkan contoh bertahap dan cek pemahaman.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Model<\/b><\/th><th><b>Langkah<\/b><\/th><th><b>Contoh pertanyaan<\/b><\/th><\/tr><tr><td>Gibbs<\/td><td>Deskripsi → perasaan → evaluasi → analisis → kesimpulan → rencana tindakan.<\/td><td>Apa yang terjadi? Apa yang berhasil? Mengapa? Apa yang akan saya ubah?<\/td><\/tr><tr><td>Kolb<\/td><td>Pengalaman konkret → observasi reflektif → konseptualisasi → eksperimen aktif.<\/td><td>Apa yang saya alami dan bagaimana menguji pemahaman baru?<\/td><\/tr><tr><td>Schön<\/td><td>Reflection-in-action dan reflection-on-action.<\/td><td>Apa yang perlu saya sesuaikan saat mengajar? Apa yang saya pelajari setelahnya?<\/td><\/tr><tr><td>Rolfe<\/td><td>What? → So What? → Now What?<\/td><td>Apa yang terjadi? Mengapa penting? Apa langkah selanjutnya?<\/td><\/tr><\/table><\/div>"}, {"g": "IV", "t": "42. Refleksi 360 derajat", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Refleksi 360 derajat mengumpulkan masukan dari berbagai pihak yang berinteraksi dengan guru, dilengkapi refleksi diri.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Memberi gambaran lebih luas tentang praktik guru dan mengurangi ketergantungan pada satu sudut pandang.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tentukan aspek yang dinilai; pilih pemberi masukan yang relevan; gunakan pertanyaan terarah; jaga kerahasiaan; bandingkan pola masukan; susun rencana perbaikan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Guru meminta siswa menilai kejelasan instruksi, rekan sejawat mengobservasi pengelolaan kelas, dan guru melakukan refleksi diri. Ketiganya menunjukkan bahwa instruksi perlu dibuat lebih ringkas.<\/p><\/div><p>Sumber masukan dapat meliputi diri sendiri, siswa, rekan sejawat, kepala sekolah, guru pamong, dosen pembimbing, dan orang tua sesuai konteks. Bukan berarti semua pihak harus selalu memberi penilaian formal.<\/p>"}, {"g": "IV", "t": "43. Penelitian Tindakan Kelas (PTK)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>PTK adalah penyelidikan reflektif dan sistematis yang dilakukan pendidik untuk memperbaiki praktik pembelajaran di kelas.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengatasi masalah nyata pembelajaran dan mengevaluasi dampak tindakan perbaikan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Identifikasi masalah; rancang tindakan; laksanakan; amati bukti; refleksikan; revisi dan lanjutkan siklus bila diperlukan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Masalah: partisipasi diskusi rendah. Tindakan: struktur peran kelompok dan pertanyaan pemandu. Data: observasi partisipasi dan hasil tugas. Refleksi: revisi pembagian peran pada siklus berikutnya.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Tahap PTK<\/b><\/th><th><b>Pertanyaan<\/b><\/th><th><b>Bukti<\/b><\/th><\/tr><tr><td>Perencanaan<\/td><td>Apa masalah dan tindakan yang akan dicoba?<\/td><td>Rencana tindakan, instrumen, indikator.<\/td><\/tr><tr><td>Tindakan<\/td><td>Bagaimana tindakan diterapkan?<\/td><td>Catatan pelaksanaan dan perangkat.<\/td><\/tr><tr><td>Pengamatan<\/td><td>Apa yang terjadi selama tindakan?<\/td><td>Observasi, hasil tugas, wawancara, dokumentasi.<\/td><\/tr><tr><td>Refleksi<\/td><td>Apa hasilnya dan apa perbaikannya?<\/td><td>Analisis data dan rencana siklus selanjutnya.<\/td><\/tr><\/table><\/div><p>Model yang umum digunakan adalah siklus perencanaan–tindakan–pengamatan–refleksi. Penelitian harus menjaga etika, privasi, dan keselamatan peserta didik.<\/p>"}, {"g": "IV", "t": "44. Komunitas belajar/Professional Learning Community", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Komunitas belajar adalah kelompok pendidik yang secara kolaboratif mempelajari kebutuhan siswa, merancang pembelajaran, memeriksa bukti hasil belajar, dan memperbaiki praktik.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mendorong peningkatan kompetensi guru melalui kolaborasi dan berbagi praktik baik.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Pilih fokus berdasarkan kebutuhan siswa; analisis hasil belajar bersama; rancang strategi; coba di kelas; bawa bukti ke pertemuan berikutnya; refleksikan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Guru Informatika dan Matematika bersama-sama merancang kegiatan membaca grafik, menguji di kelas, lalu membandingkan hasil dan memperbaiki instruksi.<\/p><\/div><p>Bentuk kegiatan: MGMP, KKG, lesson study, peer observation, coaching, diskusi perangkat ajar, analisis hasil asesmen, dan berbagi praktik baik.<\/p>"}, {"g": "IV", "t": "45. Kode etik dan empat kompetensi guru", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Kode etik guru adalah pedoman nilai dan perilaku profesional dalam menjalankan tugas pendidikan. Kompetensi guru mencakup pedagogik, kepribadian, sosial, dan profesional.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Melindungi martabat peserta didik, menjaga kepercayaan publik, serta memastikan guru bekerja secara bertanggung jawab.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Jaga keadilan dan objektivitas; hormati privasi; hindari kekerasan dan diskriminasi; jaga batas profesional; terus tingkatkan kompetensi; ikuti aturan dan kode etik yang berlaku.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Orang tua meminta nilai anak dinaikkan tanpa bukti. Guru menjelaskan kriteria dan bukti penilaian secara sopan, menjaga objektivitas, dan menawarkan kesempatan perbaikan sesuai ketentuan.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Kompetensi<\/b><\/th><th><b>Makna<\/b><\/th><th><b>Contoh perilaku<\/b><\/th><\/tr><tr><td>Pedagogik<\/td><td>Memahami siswa dan mengelola pembelajaran.<\/td><td>Merancang diferensiasi dan asesmen.<\/td><\/tr><tr><td>Kepribadian<\/td><td>Pribadi mantap, dewasa, arif, berakhlak, dan menjadi teladan.<\/td><td>Konsisten, jujur, mengendalikan emosi.<\/td><\/tr><tr><td>Sosial<\/td><td>Berkomunikasi dan berinteraksi secara efektif.<\/td><td>Kolaborasi dengan orang tua dan rekan.<\/td><\/tr><tr><td>Profesional<\/td><td>Menguasai materi dan pengembangan keilmuan.<\/td><td>Memperbarui pengetahuan Informatika.<\/td><\/tr><\/table><\/div>"}, {"g": "IV", "t": "46. Disiplin positif", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Disiplin positif adalah pendekatan pembinaan perilaku yang mengajarkan tanggung jawab, pengendalian diri, rasa hormat, dan perbaikan hubungan tanpa kekerasan atau penghinaan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membangun motivasi internal dan iklim kelas yang aman serta mendukung belajar.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Bangun kesepakatan kelas; ajarkan perilaku yang diharapkan; dengarkan siswa; gunakan konsekuensi logis; konsisten; refleksikan dampak.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa berulang kali terlambat mengumpulkan tugas. Guru berdialog untuk memahami hambatan, menyepakati jadwal realistis, dan memantau tanggung jawab, bukan mempermalukannya di depan kelas.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Pendekatan menghukum<\/b><\/th><th><b>Disiplin positif<\/b><\/th><\/tr><tr><td>Mencari siapa yang salah dan mempermalukan.<\/td><td>Memahami perilaku dan mengajarkan tanggung jawab.<\/td><\/tr><tr><td>Mengandalkan ancaman.<\/td><td>Menggunakan batas yang jelas dan konsekuensi logis.<\/td><\/tr><tr><td>Kontrol eksternal semata.<\/td><td>Membangun kesadaran dan regulasi diri.<\/td><\/tr><tr><td>Tidak selalu memperbaiki hubungan.<\/td><td>Mengupayakan pemulihan dan pencegahan.<\/td><\/tr><\/table><\/div>"}, {"g": "IV", "t": "47. Segitiga restitusi", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Segitiga restitusi adalah pendekatan pemulihan dalam disiplin positif yang membantu siswa memperbaiki kesalahan dan kembali pada nilai/keyakinan kelas.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengembangkan tanggung jawab tanpa memberi label buruk pada siswa.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Stabilkan identitas; validasi kebutuhan atau alasan di balik perilaku tanpa membenarkan tindakan; tanyakan keyakinan/nilai yang disepakati dan ajak siswa menyusun perbaikan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Siswa merusak hasil kerja teman. Guru menenangkan situasi, menggali apa yang terjadi dan kebutuhan siswa, lalu mengajak siswa menentukan cara memperbaiki hasil kerja dan memulihkan hubungan.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Tahap<\/b><\/th><th><b>Contoh pertanyaan guru<\/b><\/th><\/tr><tr><td>Menstabilkan identitas<\/td><td>&#x27;Kamu tetap bagian dari kelas ini. Kita cari cara memperbaikinya.&#x27;<\/td><\/tr><tr><td>Validasi tindakan/kebutuhan<\/td><td>&#x27;Apa yang kamu inginkan saat melakukan itu? Apa yang sedang kamu rasakan?&#x27;<\/td><\/tr><tr><td>Menanyakan keyakinan<\/td><td>&#x27;Kesepakatan kelas mana yang perlu kita jaga? Apa yang dapat kamu lakukan untuk memperbaikinya?&#x27;<\/td><\/tr><\/table><\/div><p>Validasi bukan membenarkan perilaku yang merugikan. Jika ada kekerasan, ancaman, atau risiko keselamatan, utamakan perlindungan, prosedur sekolah, dan pelibatan pihak yang berwenang.<\/p>"}, {"g": "IV", "t": "48. Lima posisi kontrol guru", "h": "<div class=\"wrap\"><table><tr><th><b>Posisi<\/b><\/th><th><b>Gambaran<\/b><\/th><th><b>Catatan<\/b><\/th><\/tr><tr><td>Penghukum<\/td><td>Menggunakan ancaman atau hukuman untuk mengendalikan.<\/td><td>Tidak membangun pemahaman internal.<\/td><\/tr><tr><td>Pembuat merasa bersalah<\/td><td>Membuat siswa merasa buruk atau berutang secara emosional.<\/td><td>Berisiko mempermalukan.<\/td><\/tr><tr><td>Teman<\/td><td>Mencari kedekatan tetapi dapat menghindari batas yang jelas.<\/td><td>Hubungan baik tetap perlu batas profesional.<\/td><\/tr><tr><td>Pemantau<\/td><td>Mengawasi kepatuhan pada aturan dan konsekuensi.<\/td><td>Dapat membantu konsistensi, tetapi belum tentu menumbuhkan pemecahan masalah.<\/td><\/tr><tr><td>Manajer<\/td><td>Membimbing siswa memahami kebutuhan, pilihan, konsekuensi, dan perbaikan.<\/td><td>Selaras dengan praktik restitusi.<\/td><\/tr><\/table><\/div><p>Dalam pendekatan restitusi, posisi manajer menjadi orientasi yang dianjurkan. Guru tetap menjaga batas, keselamatan, dan tanggung jawab.<\/p>"}, {"g": "IV", "t": "49. Moderasi beragama", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Moderasi beragama adalah cara pandang dan praktik beragama yang adil, seimbang, menghargai perbedaan, serta menolak kekerasan.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Membangun lingkungan pendidikan yang aman, saling menghormati, dan tidak diskriminatif.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Tegakkan aturan yang adil; beri ruang dialog; hindari pemaksaan keyakinan; tangani ujaran kebencian; hormati hak semua warga sekolah.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Saat siswa berbeda pendapat tentang perayaan keagamaan, guru memfasilitasi dialog yang menghormati keyakinan masing-masing dan memastikan tidak ada pemaksaan atau ejekan.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Indikator moderasi beragama<\/b><\/th><th><b>Makna ringkas<\/b><\/th><\/tr><tr><td>Komitmen kebangsaan<\/td><td>Menghargai kesepakatan berbangsa dan konstitusi.<\/td><\/tr><tr><td>Toleransi<\/td><td>Menghormati perbedaan keyakinan dan praktik.<\/td><\/tr><tr><td>Anti-kekerasan<\/td><td>Menolak kekerasan sebagai cara menyelesaikan perbedaan.<\/td><\/tr><tr><td>Akomodatif terhadap budaya lokal<\/td><td>Menghargai tradisi lokal sepanjang tidak bertentangan dengan prinsip dasar yang dianut.<\/td><\/tr><\/table><\/div><p>Nilai yang sering dibahas: tawassuth (jalan tengah), tawazun (seimbang), i&#x27;tidal (adil/lurus), tasamuh (toleransi), syura (musyawarah), islah (perbaikan), dan muwathanah (cinta tanah air).<\/p>"}, {"g": "IV", "t": "50. Literasi digital dan etika digital", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>Literasi digital adalah kecakapan mengakses, memahami, mengevaluasi, membuat, dan berpartisipasi di ruang digital secara aman, kritis, etis, dan bertanggung jawab.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Melindungi diri dan peserta didik, menilai informasi, serta menggunakan teknologi secara produktif.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Periksa sumber dan tanggal; lindungi data pribadi; gunakan kata sandi kuat; hormati hak cipta; laporkan perundungan; gunakan AI secara transparan dan kritis.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Sebelum membagikan foto kegiatan kelas, guru memeriksa izin dan kebijakan sekolah, menghindari data sensitif, serta memastikan unggahan tidak merugikan siswa.<\/p><\/div><div class=\"wrap\"><table><tr><th><b>Pilar<\/b><\/th><th><b>Fokus<\/b><\/th><th><b>Contoh<\/b><\/th><\/tr><tr><td>Digital Skills<\/td><td>Kecakapan menggunakan perangkat dan layanan digital.<\/td><td>Menggunakan LMS dan mengelola berkas.<\/td><\/tr><tr><td>Digital Culture<\/td><td>Nilai dan perilaku budaya di ruang digital.<\/td><td>Berkomunikasi santun dan menghargai perbedaan.<\/td><\/tr><tr><td>Digital Ethics<\/td><td>Etika dan tanggung jawab digital.<\/td><td>Menghormati hak cipta dan tidak menyebarkan hoaks.<\/td><\/tr><tr><td>Digital Safety<\/td><td>Keamanan dan perlindungan data.<\/td><td>Mengaktifkan autentikasi berlapis dan menjaga data siswa.<\/td><\/tr><\/table><\/div>"}, {"g": "IV", "t": "51. Pengembangan Keprofesian Berkelanjutan (PKB)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>PKB adalah proses berkelanjutan bagi guru untuk meningkatkan pengetahuan, keterampilan, dan kualitas praktik profesional.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Menjaga kompetensi tetap relevan dan meningkatkan kualitas pembelajaran.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Identifikasi kebutuhan; tetapkan target; pilih pelatihan/komunitas/penelitian; terapkan hasil belajar; kumpulkan bukti dampak; refleksikan.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Guru mengikuti pelatihan asesmen, menerapkan rubrik analitik, meminta masukan rekan sejawat, lalu membandingkan kualitas umpan balik sebelum dan sesudah.<\/p><\/div><p>Kegiatan dapat mencakup pengembangan diri, publikasi ilmiah, karya inovatif, komunitas belajar, mentoring, coaching, dan refleksi.<\/p>"}, {"g": "IV", "t": "52. Situational Judgment Test (SJT)", "h": "<div class=\"blk def\"><b class=\"lb\">Inti / pengertian<\/b><p>SJT menyajikan situasi kerja atau dilema dan meminta peserta memilih atau menilai tindakan yang paling tepat. Dalam konteks guru, skenario dapat berkaitan dengan pembelajaran, etika, komunikasi, keselamatan, dan kolaborasi.<\/p><\/div><div class=\"blk tuj\"><b class=\"lb\">Tujuan &amp; manfaat<\/b><p>Mengukur penilaian profesional dan kemampuan memilih tindakan yang efektif, etis, proporsional, serta berpihak pada kepentingan terbaik peserta didik.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara penerapan<\/b><p>Baca fakta; identifikasi masalah utama dan risiko; tentukan prinsip/aturan; pilih tindakan awal yang aman dan proporsional; komunikasikan; dokumentasikan bila perlu; tindak lanjuti.<\/p><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh kasus<\/b><p>Ketika siswa menjadi korban perundungan, guru memastikan keselamatan, mendengarkan siswa secara privat, mengikuti prosedur perlindungan sekolah, melibatkan pihak terkait, dan memantau agar perundungan tidak berulang.<\/p><\/div>"}, {"g": "IV", "t": "53. Kerangka menjawab soal SJT", "h": "<div class=\"wrap\"><table><tr><th><b>Langkah<\/b><\/th><th><b>Pertanyaan panduan<\/b><\/th><th><b>Tindakan yang diutamakan<\/b><\/th><\/tr><tr><td>1. Pahami fakta<\/td><td>Apa yang benar-benar terjadi? Apa yang masih dugaan?<\/td><td>Pisahkan fakta, asumsi, dan informasi yang belum diketahui.<\/td><\/tr><tr><td>2. Prioritaskan keselamatan<\/td><td>Adakah risiko kekerasan, perundungan, atau bahaya?<\/td><td>Lindungi pihak terdampak dan ikuti prosedur.<\/td><\/tr><tr><td>3. Pahami kebutuhan<\/td><td>Siapa yang terdampak dan dukungan apa yang diperlukan?<\/td><td>Dengarkan secara empatik dan jaga privasi.<\/td><\/tr><tr><td>4. Pilih tindakan profesional<\/td><td>Apa yang adil, etis, dan sesuai aturan?<\/td><td>Komunikasi, kolaborasi, objektivitas, dan proporsionalitas.<\/td><\/tr><tr><td>5. Tindak lanjuti<\/td><td>Bagaimana memastikan masalah tidak berulang?<\/td><td>Pantau, dokumentasikan seperlunya, evaluasi.<\/td><\/tr><\/table><\/div><p>Tidak semua kasus diselesaikan hanya dengan dialog. Untuk kekerasan, pelecehan, ancaman keselamatan, atau pelanggaran serius, guru harus mengikuti mekanisme perlindungan dan pelaporan yang berlaku.<\/p>"}, {"g": "V", "t": "54. Contoh rancangan pembelajaran terpadu Informatika", "h": "<p>Topik: Analisis data sederhana dan visualisasi data. Fase/kelas disesuaikan dengan CP dan ATP satuan pendidikan. Alokasi waktu: ilustrasi 2–3 pertemuan.<\/p><div class=\"wrap\"><table><tr><th><b>Komponen<\/b><\/th><th><b>Rancangan contoh<\/b><\/th><\/tr><tr><td>Tujuan<\/td><td>Siswa mampu mengumpulkan, mengelompokkan, menyajikan, dan menafsirkan data sederhana.<\/td><\/tr><tr><td>Pengetahuan awal<\/td><td>Mampu membaca tabel sederhana dan melakukan operasi hitung dasar.<\/td><\/tr><tr><td>Asesmen diagnostik<\/td><td>Tiga pertanyaan tentang membaca tabel, mengenali kategori, dan menghitung jumlah.<\/td><\/tr><tr><td>Model<\/td><td>PBL atau inquiry; kelompok menyelidiki pertanyaan tentang kebiasaan penggunaan transportasi ke sekolah.<\/td><\/tr><tr><td>Aktivitas<\/td><td>Menyusun pertanyaan survei; mengumpulkan data anonim; mengolah dalam tabel; membuat grafik; menafsirkan hasil.<\/td><\/tr><tr><td>TPACK<\/td><td>CK: konsep data/grafik; PK: penyelidikan kolaboratif; TK: spreadsheet.<\/td><\/tr><tr><td>Diferensiasi<\/td><td>Template tabel untuk siswa yang perlu dukungan; pilihan jenis grafik; tantangan membandingkan dua variabel.<\/td><\/tr><tr><td>CRT<\/td><td>Konteks transportasi dan lingkungan siswa digunakan tanpa menilai pilihan keluarga.<\/td><\/tr><tr><td>Literasi-numerasi<\/td><td>Membaca instruksi dan sumber; menghitung frekuensi/persentase; membaca grafik.<\/td><\/tr><tr><td>Asesmen formatif<\/td><td>Observasi kerja kelompok, cek tabel, dan pertanyaan lisan.<\/td><\/tr><tr><td>Asesmen sumatif<\/td><td>Produk grafik dan penjelasan kesimpulan.<\/td><\/tr><tr><td>Rubrik<\/td><td>Ketepatan data, pemilihan grafik, interpretasi, komunikasi.<\/td><\/tr><tr><td>Refleksi<\/td><td>Siswa menuliskan satu hal yang dipahami dan satu hal yang perlu ditingkatkan.<\/td><\/tr><\/table><\/div>"}, {"g": "V", "t": "55. Contoh rubrik analitik proyek", "h": "<div class=\"wrap\"><table><tr><th><b>Kriteria<\/b><\/th><th><b>4 — Sangat baik<\/b><\/th><th><b>3 — Baik<\/b><\/th><th><b>2 — Berkembang<\/b><\/th><th><b>1 — Perlu bimbingan<\/b><\/th><\/tr><tr><td>Ketepatan data<\/td><td>Data lengkap, konsisten, dan akurat.<\/td><td>Ada kekeliruan kecil.<\/td><td>Beberapa data tidak konsisten.<\/td><td>Data tidak dapat digunakan.<\/td><\/tr><tr><td>Visualisasi<\/td><td>Grafik tepat, jelas, berlabel lengkap.<\/td><td>Grafik tepat dengan kekurangan kecil.<\/td><td>Grafik kurang tepat/label kurang.<\/td><td>Grafik tidak mewakili data.<\/td><\/tr><tr><td>Interpretasi<\/td><td>Kesimpulan akurat dan didukung bukti.<\/td><td>Kesimpulan cukup tepat.<\/td><td>Kesimpulan masih umum.<\/td><td>Kesimpulan tidak sesuai data.<\/td><\/tr><tr><td>Kolaborasi<\/td><td>Berbagi peran dan saling mendukung.<\/
