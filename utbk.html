td><td>Sebagian besar anggota berkontribusi.<\/td><td>Kontribusi tidak merata.<\/td><td>Kerja kelompok tidak berjalan.<\/td><\/tr><\/table><\/div>"}, {"g": "V", "t": "56. Latihan studi kasus SJT", "h": "<h4>Kasus 1 — Siswa tidak mengumpulkan tugas<\/h4><div class=\"blk ok\"><b class=\"lb\">Respons yang disarankan<\/b><p>Seorang siswa tiga kali tidak mengumpulkan tugas. Pilihan terbaik adalah mencari informasi penyebab secara privat, memeriksa hambatan akses/pemahaman, menyepakati langkah penyelesaian yang realistis, dan memantau tindak lanjut.<\/p><\/div><div class=\"blk no\"><b class=\"lb\">Hindari<\/b><p>Hindari langsung mempermalukan, memberi label malas, atau memberi nilai nol tanpa memeriksa bukti dan ketentuan.<\/p><\/div><h4>Kasus 2 — Perundungan di kelas<\/h4><div class=\"blk ok\"><b class=\"lb\">Respons yang disarankan<\/b><p>Guru melihat siswa mengejek temannya secara berulang. Tindakan awal adalah menghentikan perilaku dan memastikan keselamatan, mendengarkan pihak terdampak secara terpisah, mengikuti prosedur sekolah, melibatkan pihak yang berwenang, serta memantau.<\/p><\/div><div class=\"blk no\"><b class=\"lb\">Hindari<\/b><p>Jangan memaksa korban berdamai di depan umum atau menganggapnya sekadar bercanda.<\/p><\/div><h4>Kasus 3 — Orang tua memprotes nilai<\/h4><div class=\"blk ok\"><b class=\"lb\">Respons yang disarankan<\/b><p>Orang tua meminta nilai dinaikkan. Guru menjelaskan kriteria, menunjukkan bukti asesmen secara proporsional, mendengarkan keberatan, dan menawarkan klarifikasi atau tindak lanjut sesuai prosedur.<\/p><\/div><div class=\"blk no\"><b class=\"lb\">Hindari<\/b><p>Jangan mengubah nilai tanpa dasar atau berdebat secara emosional.<\/p><\/div><h4>Kasus 4 — Siswa tertinggal dari prasyarat<\/h4><div class=\"blk ok\"><b class=\"lb\">Respons yang disarankan<\/b><p>Sebagian siswa belum memahami konsep dasar yang dibutuhkan. Guru menggunakan asesmen diagnostik, memberi penguatan prasyarat, mengelompokkan secara fleksibel, dan memantau kemajuan.<\/p><\/div><div class=\"blk no\"><b class=\"lb\">Hindari<\/b><p>Jangan melanjutkan materi kompleks seolah seluruh siswa sudah siap.<\/p><\/div><h4>Kasus 5 — Foto siswa akan diunggah<\/h4><div class=\"blk ok\"><b class=\"lb\">Respons yang disarankan<\/b><p>Guru ingin mengunggah dokumentasi kelas. Guru memeriksa izin, kebijakan sekolah, tujuan publikasi, dan data yang terlihat; hindari informasi pribadi dan hormati pilihan keluarga.<\/p><\/div><div class=\"blk no\"><b class=\"lb\">Hindari<\/b><p>Jangan menganggap semua dokumentasi otomatis boleh dipublikasikan.<\/p><\/div><h4>Kasus 6 — Konflik antarsiswa karena perbedaan<\/h4><div class=\"blk ok\"><b class=\"lb\">Respons yang disarankan<\/b><p>Guru menghentikan ejekan, memastikan semua pihak aman, mendengarkan tanpa prasangka, menegaskan kesepakatan saling menghormati, dan memfasilitasi dialog yang aman.<\/p><\/div><div class=\"blk no\"><b class=\"lb\">Hindari<\/b><p>Jangan memihak berdasarkan latar belakang atau memaksa siswa mengungkap keyakinan pribadi.<\/p><\/div>"}, {"g": "V", "t": "57. Contoh pertanyaan refleksi guru", "h": "<p>Apakah tujuan pembelajaran tercapai? Bukti apa yang mendukung kesimpulan tersebut?<\/p><p>Bagian mana yang paling membantu siswa memahami materi?<\/p><p>Siswa mana yang belum terjangkau oleh strategi pembelajaran saya?<\/p><p>Apakah instruksi, media, dan asesmen dapat diakses semua siswa?<\/p><p>Apakah saya memberi kesempatan yang adil untuk bertanya dan berpartisipasi?<\/p><p>Apa satu perubahan konkret yang akan saya lakukan pada pertemuan berikutnya?<\/p>"}, {"g": "V", "t": "58. Ringkasan pembeda konsep yang sering tertukar", "h": "<div class=\"wrap\"><table><tr><th><b>Konsep A vs B<\/b><\/th><th><b>Perbedaan inti<\/b><\/th><\/tr><tr><td>Diferensiasi vs TaRL<\/td><td>Diferensiasi menyesuaikan konten/proses/produk/lingkungan berdasarkan kebutuhan; TaRL secara khusus memulai dari level kemampuan aktual.<\/td><\/tr><tr><td>CRT vs pendidikan inklusif<\/td><td>CRT menautkan pembelajaran dengan budaya dan pengalaman; inklusi menghilangkan hambatan agar semua dapat berpartisipasi. Keduanya dapat berjalan bersama.<\/td><\/tr><tr><td>PjBL vs PBL<\/td><td>PjBL berpusat pada proyek/produk; PBL berpusat pada penyelidikan dan pemecahan masalah.<\/td><\/tr><tr><td>Diagnostik vs formatif<\/td><td>Diagnostik memetakan kondisi awal/kebutuhan; formatif memantau proses dan menentukan langkah belajar berikutnya.<\/td><\/tr><tr><td>Formatif vs sumatif<\/td><td>Formatif terutama untuk memperbaiki proses belajar; sumatif menilai capaian pada akhir lingkup/periode.<\/td><\/tr><tr><td>Rubrik analitik vs holistik<\/td><td>Analitik menilai tiap kriteria terpisah; holistik menilai kualitas keseluruhan.<\/td><\/tr><tr><td>Akomodasi vs modifikasi<\/td><td>Akomodasi mengubah akses/cara tanpa mengubah kompetensi inti yang dinilai; modifikasi mengubah target/kompleksitas kompetensi.<\/td><\/tr><tr><td>Refleksi vs PTK<\/td><td>Refleksi meninjau praktik; PTK merupakan penyelidikan sistematis dengan tindakan dan pengumpulan data untuk perbaikan.<\/td><\/tr><tr><td>Disiplin positif vs restitusi<\/td><td>Disiplin positif adalah pendekatan luas pembinaan perilaku; restitusi adalah salah satu strategi pemulihan dalam pendekatan tersebut.<\/td><\/tr><tr><td>Pengukuran vs evaluasi<\/td><td>Pengukuran menghasilkan skor; evaluasi menilai keberhasilan proses/program dan mendukung keputusan.<\/td><\/tr><\/table><\/div>"}, {"g": "V", "t": "59. Strategi belajar dan persiapan UKPPPG", "h": "<p>Kuasai definisi inti, tetapi selalu hubungkan dengan situasi kelas.<\/p><p>Untuk teori belajar, fokus pada ciri teori dan implikasi praktiknya.<\/p><p>Untuk perencanaan, pastikan CP–TP–ATP–asesmen–aktivitas saling selaras.<\/p><p>Untuk asesmen, biasakan membaca bukti belajar dan menentukan tindak lanjut.<\/p><p>Untuk SJT, utamakan keselamatan, kepentingan terbaik siswa, keadilan, etika, komunikasi, dan tindak lanjut.<\/p><p>Latih jawaban dengan alasan: mengapa tindakan tersebut paling tepat dan mengapa alternatif lain kurang tepat.<\/p><p>Gunakan dokumen resmi terbaru sebagai rujukan akhir untuk kebijakan kurikulum, asesmen, perlindungan siswa, dan kode etik.<\/p>"}, {"g": "V", "t": "60. Glosarium singkat", "h": "<div class=\"wrap\"><table><tr><th><b>Istilah<\/b><\/th><th><b>Arti singkat<\/b><\/th><\/tr><tr><td>CP<\/td><td>Capaian Pembelajaran pada akhir fase.<\/td><\/tr><tr><td>TP<\/td><td>Tujuan Pembelajaran.<\/td><\/tr><tr><td>ATP<\/td><td>Alur Tujuan Pembelajaran.<\/td><\/tr><tr><td>KKTP<\/td><td>Kriteria Ketercapaian Tujuan Pembelajaran.<\/td><\/tr><tr><td>PPI<\/td><td>Program Pembelajaran Individual.<\/td><\/tr><tr><td>UDL<\/td><td>Universal Design for Learning.<\/td><\/tr><tr><td>ZPD<\/td><td>Zona Perkembangan Proksimal.<\/td><\/tr><tr><td>TPACK<\/td><td>Integrasi pengetahuan teknologi, pedagogi, dan konten.<\/td><\/tr><tr><td>PjBL<\/td><td>Project Based Learning.<\/td><\/tr><tr><td>PBL<\/td><td>Problem Based Learning.<\/td><\/tr><tr><td>PTK<\/td><td>Penelitian Tindakan Kelas.<\/td><\/tr><tr><td>PLC<\/td><td>Professional Learning Community/komunitas belajar profesional.<\/td><\/tr><tr><td>SJT<\/td><td>Situational Judgment Test.<\/td><\/tr><tr><td>HOTS<\/td><td>Higher Order Thinking Skills.<\/td><\/tr><tr><td>PKB<\/td><td>Pengembangan Keprofesian Berkelanjutan.<\/td><\/tr><\/table><\/div><p>PDF acuan mengelompokkan kompetensi ke dalam empat ranah: Pedagogik (P), Kepribadian (K), Sosial (S), dan Profesional (PF). Keempatnya saling melengkapi. Pedagogik berfokus pada pengelolaan pembelajaran; kepribadian pada keteladanan dan kematangan diri; sosial pada komunikasi dan kolaborasi; profesional pada penguasaan tujuan pendidikan, materi, kurikulum, dan pengembangan praktik.<\/p><div class=\"wrap\"><table><tr><th><b>Ranah<\/b><\/th><th><b>Fokus utama<\/b><\/th><th><b>Pertanyaan refleksi guru<\/b><\/th><\/tr><tr><td>Pedagogik (P)<\/td><td>Bagaimana merancang, melaksanakan, dan menilai pembelajaran yang berpusat pada murid?<\/td><td>Apakah murid memahami, terlibat, memperoleh dukungan, dan mendapat umpan balik?<\/td><\/tr><tr><td>Kepribadian (K)<\/td><td>Bagaimana guru menjadi pribadi yang etis, matang, reflektif, dan konsisten?<\/td><td>Apakah keputusan saya adil, bertanggung jawab, dan memberi teladan?<\/td><\/tr><tr><td>Sosial (S)<\/td><td>Bagaimana guru berkomunikasi dan bekerja sama dengan murid, rekan, keluarga, dan masyarakat?<\/td><td>Apakah komunikasi saya inklusif, empatik, jelas, dan kolaboratif?<\/td><\/tr><tr><td>Profesional (PF)<\/td><td>Bagaimana guru menguasai tujuan pendidikan, disiplin ilmu, kebutuhan murid, kurikulum, dan praktik profesional?<\/td><td>Apakah materi dan strategi saya akurat, kontekstual, serta terus dikembangkan?<\/td><\/tr><\/table><\/div>"}, {"g": "A", "t": "1. Kompetensi Pedagogik (P)", "h": "<p>Rumusan PDF: kemampuan mengelola pembelajaran yang berpusat pada Murid untuk mencapai tujuan pembelajaran atau pembimbingan.<\/p><div class=\"wrap\"><table><tr><th><b>Kode<\/b><\/th><th><b>Subkompetensi sesuai PDF<\/b><\/th><\/tr><tr><td>P.1<\/td><td>Merancang dan memfasilitasi pengalaman belajar Murid yang mendorong pemahaman konseptual, penerapan kontekstual, dan refleksi bermakna terhadap proses pembelajaran.<\/td><\/tr><tr><td>P.2<\/td><td>Melaksanakan pembelajaran yang responsif terhadap keragaman latar belakang, kebutuhan, dan potensi Murid melalui berbagai model pembelajaran.<\/td><\/tr><tr><td>P.3<\/td><td>Menciptakan proses pembelajaran yang berkesadaran, bermakna, dan menggembirakan.<\/td><\/tr><tr><td>P.4<\/td><td>Mengintegrasikan teknologi informasi dan komunikasi secara kritis dan kreatif dalam pembelajaran untuk memperluas akses, memperdalam pemahaman, dan mendukung literasi digital Murid.<\/td><\/tr><tr><td>P.5<\/td><td>Menerapkan strategi pembelajaran atau pembimbingan yang sesuai karakteristik Murid dengan memanfaatkan sumber belajar dan mempertimbangkan potensi lingkungan dan kearifan lokal.<\/td><\/tr><tr><td>P.6<\/td><td>Melaksanakan asesmen untuk mengetahui kebutuhan belajar, memberikan umpan balik, dan mengukur hasil belajar Murid secara berkesinambungan dan reflektif.<\/td><\/tr><\/table><\/div>"}, {"g": "A", "t": "2. Kompetensi Kepribadian (K)", "h": "<p>Rumusan PDF: kemampuan kepribadian yang mantap, berakhlak mulia, arif, dan berwibawa serta menjadi teladan bagi Murid, lingkungan, dan masyarakat, yang ditunjukkan dengan kematangan spiritual, moral, dan emosional, serta kebiasaan melakukan refleksi diri dalam pembelajaran.<\/p><div class=\"wrap\"><table><tr><th><b>Kode<\/b><\/th><th><b>Subkompetensi sesuai PDF<\/b><\/th><\/tr><tr><td>K.1<\/td><td>Menampilkan perilaku etis dan keteladanan yang mencerminkan kematangan spiritual, moral, dan emosional berdasarkan Ketuhanan Yang Maha Esa dan nilai-nilai keberagaman.<\/td><\/tr><tr><td>K.2<\/td><td>Melakukan refleksi diri secara berkesinambungan, mengembangkan pola pikir bertumbuh, serta belajar sepanjang hayat untuk peningkatan kualitas diri.<\/td><\/tr><tr><td>K.3<\/td><td>Mengambil keputusan dan bertindak secara konsisten dalam mengembangkan potensi dan budaya belajar Murid.<\/td><\/tr><\/table><\/div>"}, {"g": "A", "t": "3. Kompetensi Sosial (S)", "h": "<p>Rumusan PDF: kemampuan berkomunikasi, berinteraksi, dan berkolaborasi secara efektif dan efisien dengan Murid, sesama Pendidik, orang tua/wali Murid, dan masyarakat dalam pengembangan pembelajaran yang berpusat pada Murid dan pengembangan profesi.<\/p><div class=\"wrap\"><table><tr><th><b>Kode<\/b><\/th><th><b>Subkompetensi sesuai PDF<\/b><\/th><\/tr><tr><td>S.1<\/td><td>Berkomunikasi secara inklusif, empatik, dan efektif secara lisan, tulisan, dan/atau isyarat dengan memperhatikan keragaman dan kebutuhan Murid.<\/td><\/tr><tr><td>S.2<\/td><td>Berkolaborasi dengan Murid, sesama Pendidik, Tenaga Kependidikan selain Pendidik, orang tua/wali Murid, dan masyarakat untuk meningkatkan kualitas pembelajaran.<\/td><\/tr><tr><td>S.3<\/td><td>Berpartisipasi aktif dalam organisasi profesi dan komunitas pembelajaran untuk pengembangan keprofesian berkelanjutan.<\/td><\/tr><\/table><\/div>"}, {"g": "A", "t": "4. Kompetensi Profesional (PF)", "h": "<p>Rumusan PDF: kemampuan penguasaan materi pelajaran secara mendalam dan kontekstual.<\/p><div class=\"wrap\"><table><tr><th><b>Kode<\/b><\/th><th><b>Subkompetensi sesuai PDF<\/b><\/th><\/tr><tr><td>PF.1<\/td><td>Menguasai tujuan pendidikan terutama pada Satuan Pendidikan yang diampu.<\/td><\/tr><tr><td>PF.2<\/td><td>Menguasai disiplin ilmu sesuai dengan materi/muatan pembelajaran atau pembimbingan.<\/td><\/tr><tr><td>PF.3<\/td><td>Memahami potensi dan kebutuhan belajar Murid berdasarkan karakteristik materi pembelajaran atau pembimbingan dan konteks lokal.<\/td><\/tr><tr><td>PF.4<\/td><td>Memahami, menerapkan, dan mengembangkan kurikulum secara adaptif dan kontekstual sesuai perkembangan zaman.<\/td><\/tr><tr><td>PF.5<\/td><td>Mengembangkan praktik profesional pendidikan secara konseptual, empiris, kreatif, dan inovatif.<\/td><\/tr><\/table><\/div><p>Bagian ini menguraikan maksud praktis dari tiap rumusan PDF. Indikator dan contoh berikut adalah alat bantu belajar, bukan pengganti rumusan kompetensi.<\/p>"}, {"g": "B", "t": "P.1 — Pengalaman belajar konseptual, kontekstual, dan reflektif", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru tidak berhenti pada penyampaian definisi atau hafalan. Murid perlu membangun pengertian, menggunakannya pada situasi nyata, dan memikirkan kembali proses belajarnya.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Tujuan pembelajaran jelas dan dapat diamati.<\/li><li>Aktivitas menuntun murid menjelaskan alasan, bukan sekadar meniru prosedur.<\/li><li>Konsep dihubungkan dengan masalah atau pengalaman sehari-hari.<\/li><li>Ada kesempatan menyimpulkan dan merefleksikan proses.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Pada materi algoritma, murid menyusun instruksi membuat minuman secara unplugged, menguji instruksi dengan teman yang berperan sebagai komputer, menemukan ambiguitas, lalu memperbaiki algoritma dan menulis refleksi tentang kesalahan yang ditemukan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika murid hanya menghafal definisi algoritma, guru perlu memberi pengalaman menyusun, menjalankan, menguji, dan memperbaiki instruksi agar pemahaman konseptual terbentuk.<\/p><\/div>"}, {"g": "B", "t": "P.2 — Responsif terhadap keragaman murid", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru mengenali perbedaan kesiapan, minat, latar belakang, bahasa, akses teknologi, dan kebutuhan dukungan. Responsif bukan berarti menurunkan tujuan untuk semua, melainkan menyediakan jalan belajar dan dukungan yang sesuai.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Melakukan asesmen awal atau pengamatan kebutuhan.<\/li><li>Menyediakan variasi dukungan, sumber, proses, atau cara menunjukkan pemahaman.<\/li><li>Menghindari perlakuan diskriminatif dan pelabelan.<\/li><li>Memastikan akomodasi tidak menghilangkan kompetensi inti yang diukur.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Untuk materi representasi data, sebagian murid memakai tabel panduan, sebagian membaca dataset sederhana, dan murid yang siap mendapat tantangan membandingkan dua jenis grafik. Murid yang tidak memiliki gawai dapat memakai lembar cetak atau perangkat sekolah.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika sebagian murid berbagi gawai dan ada murid kesulitan memahami audio, sediakan transkrip, bahan cetak, serta akses perangkat di sekolah; jangan mewajibkan unggahan serentak dari rumah.<\/p><\/div>"}, {"g": "B", "t": "P.3 — Pembelajaran berkesadaran, bermakna, dan menggembirakan", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Berkesadaran berarti murid mengetahui tujuan, proses, dan kemajuan belajarnya. Bermakna berarti materi terasa relevan. Menggembirakan berarti suasana aman, menantang secara wajar, dan memberi ruang partisipasi; bukan berarti semua kegiatan harus berupa permainan.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Guru menyampaikan tujuan dan kriteria keberhasilan dengan bahasa yang dipahami murid.<\/li><li>Murid mengetahui alasan mempelajari materi.<\/li><li>Iklim kelas aman untuk bertanya dan melakukan kesalahan.<\/li><li>Aktivitas menantang, variatif, dan memberi rasa berhasil.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Sebelum belajar keamanan digital, guru menyampaikan tujuan: murid dapat mengenali tautan mencurigakan. Murid menganalisis contoh pesan fiktif, berdiskusi tanpa mempermalukan jawaban keliru, lalu menuliskan satu tindakan aman yang akan dilakukan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika kelas pasif, guru dapat memulai dengan kasus dekat kehidupan murid, menjelaskan tujuan, memberi pilihan aktivitas, dan menutup dengan refleksi singkat.<\/p><\/div>"}, {"g": "B", "t": "P.4 — Integrasi TIK secara kritis dan kreatif", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Teknologi dipilih karena mendukung akses, pemahaman, kolaborasi, asesmen, atau literasi digital. Penggunaan aplikasi semata tidak otomatis menunjukkan pembelajaran berkualitas.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Tujuan pedagogis mendahului pemilihan aplikasi.<\/li><li>Mempertimbangkan akses, keamanan, privasi, hak cipta, dan kesesuaian usia.<\/li><li>Teknologi memperjelas konsep atau memperluas partisipasi.<\/li><li>Murid belajar menggunakan teknologi secara kritis dan bertanggung jawab.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Spreadsheet digunakan untuk mengurutkan data dan membuat grafik; LMS untuk membagikan materi dan memberi umpan balik; simulasi digunakan untuk mengamati alur percabangan. Guru tetap menyiapkan alternatif offline bila koneksi tidak tersedia.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika aplikasi daring membuat murid tanpa perangkat tertinggal, guru menyediakan versi luring/lembar kerja atau jadwal perangkat sekolah, bukan menjadikan kepemilikan gawai sebagai syarat pemahaman.<\/p><\/div>"}, {"g": "B", "t": "P.5 — Strategi sesuai karakteristik, sumber belajar, lingkungan, dan kearifan lokal", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru memilih strategi dan sumber belajar berdasarkan tujuan, karakteristik murid, materi, serta konteks sekitar. Lingkungan lokal dapat menjadi sumber belajar meski kunjungan langsung tidak memungkinkan.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Sumber belajar relevan dengan tujuan dan akurat.<\/li><li>Konteks lokal digunakan secara bermakna, bukan sebagai hiasan.<\/li><li>Strategi sesuai usia, kesiapan, dan karakter materi.<\/li><li>Guru menjaga agar konteks tidak menstereotipkan kelompok atau keluarga.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Murid mempelajari data dengan mengumpulkan data sederhana tentang moda transportasi ke sekolah secara sukarela dan anonim, lalu menyajikannya dalam tabel/grafik. Untuk topik ekosistem, foto dan catatan organisme sawah dapat dipakai untuk memodelkan hubungan makan dan arah perpindahan energi.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika kunjungan ke sawah belum memungkinkan, gunakan foto, catatan organisme, atau data lapangan yang dapat dipercaya. Pertahankan tujuan menjelaskan perpindahan energi; jangan menggantinya menjadi sekadar menyebut nama hewan.<\/p><\/div>"}, {"g": "B", "t": "P.6 — Asesmen berkesinambungan dan reflektif", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Asesmen digunakan untuk mengetahui kebutuhan, memberi umpan balik, dan mengukur hasil. Bukti belajar dikumpulkan selama proses dan pada akhir pembelajaran, kemudian digunakan untuk menentukan langkah berikutnya.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Asesmen selaras dengan tujuan dan kriteria.<\/li><li>Guru menggunakan hasil asesmen untuk menyesuaikan pengajaran.<\/li><li>Umpan balik spesifik, dapat ditindaklanjuti, dan tepat waktu.<\/li><li>Hasil asesmen dijaga kerahasiaannya dan digunakan secara etis.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Pada materi flowchart, guru mengamati diskusi, memeriksa draf flowchart, memberi komentar pada kesalahan logika, lalu memberi kesempatan revisi. Di akhir, murid mengerjakan tugas individu untuk menunjukkan penguasaan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika asesmen awal menunjukkan kesulitan membaca, analisis pola kesalahan, beri umpan balik pribadi, siapkan latihan sesuai kebutuhan, dan cek ulang. Jangan mengumumkan nilai terendah atau mengirim daftar nilai lengkap ke grup.<\/p><\/div>"}, {"g": "B", "t": "K.1 — Etika dan keteladanan dalam keberagaman", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru menunjukkan integritas, tanggung jawab, kejujuran, penghormatan, pengendalian emosi, serta sikap adil. Nilai keberagaman tampak dalam tindakan sehari-hari dan cara guru memperlakukan murid.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Bersikap adil dan tidak merendahkan murid.<\/li><li>Menjaga ucapan, perilaku, dan komitmen.<\/li><li>Menghormati perbedaan latar belakang dan keyakinan.<\/li><li>Menjaga rahasia dan menghindari konflik kepentingan.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Ketika terjadi perbedaan pendapat dalam diskusi etika AI, guru meminta murid menyampaikan alasan dengan santun, melarang ejekan, dan memastikan semua kelompok memperoleh kesempatan berbicara.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika seorang murid membuat kesalahan, guru menegur perilakunya secara proporsional tanpa mempermalukan identitas atau latar belakangnya.<\/p><\/div>"}, {"g": "B", "t": "K.2 — Refleksi berkelanjutan, growth mindset, belajar sepanjang hayat", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru memeriksa dampak tindakannya dengan bukti, menerima masukan, mengakui area yang perlu diperbaiki, dan mencoba strategi baru. Growth mindset bukan sekadar berkata &#x27;pasti bisa&#x27;, tetapi melihat kemampuan dapat berkembang melalui usaha, strategi, dan dukungan.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Refleksi didasarkan pada data atau kejadian spesifik.<\/li><li>Guru terbuka terhadap umpan balik murid, rekan, dan pembimbing.<\/li><li>Perbaikan direncanakan dan dievaluasi kembali.<\/li><li>Guru mengikuti pengembangan kompetensi yang relevan.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Setelah pembelajaran jaringan komputer, guru menemukan banyak murid keliru membedakan internet dan web. Guru meninjau pertanyaan diagnostik, berdiskusi dengan rekan, membuat analogi dan simulasi baru, lalu membandingkan hasil asesmen berikutnya.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika sebagian besar murid gagal pada indikator yang sama, jangan langsung menyalahkan murid. Periksa kejelasan penjelasan, urutan materi, contoh, waktu, dan instrumen asesmen.<\/p><\/div>"}, {"g": "B", "t": "K.3 — Keputusan konsisten untuk potensi dan budaya belajar murid", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru membuat keputusan yang berpihak pada perkembangan murid dan menerapkannya secara konsisten, termasuk aturan, dukungan, tindak lanjut, dan kesempatan berkembang.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Aturan kelas jelas dan diterapkan secara adil.<\/li><li>Memberi kesempatan berkembang, bukan hanya fokus pada nilai akhir.<\/li><li>Mengambil keputusan berdasarkan kebutuhan dan bukti.<\/li><li>Membangun kebiasaan belajar, tanggung jawab, dan kemandirian.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Guru menerapkan kesepakatan penggunaan komputer secara konsisten: menjaga perangkat, bergiliran, mencatat kendala, dan mengembalikan alat. Murid yang melakukan kesalahan dibimbing memperbaiki dampaknya.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika ada murid melanggar kesepakatan, respons guru tetap konsisten, proporsional, dan mendidik; tidak pilih kasih karena kedekatan atau prestasi murid.<\/p><\/div>"}, {"g": "B", "t": "S.1 — Komunikasi inklusif, empatik, dan efektif", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru menyampaikan informasi dengan jelas dan menghargai perbedaan cara komunikasi serta kebutuhan murid. Empati berarti mendengarkan dan memahami sebelum memberi respons.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Menggunakan bahasa yang jelas, santun, dan tidak merendahkan.<\/li><li>Mendengarkan aktif dan memberi ruang tanggapan.<\/li><li>Menyesuaikan media komunikasi dengan kebutuhan murid.<\/li><li>Memberi instruksi tertulis/visual bila diperlukan.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Guru menjelaskan tugas coding dengan instruksi lisan, langkah tertulis, dan diagram. Saat murid kesulitan, guru bertanya bagian mana yang membingungkan, bukan mengatakan murid tidak memperhatikan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika murid kesulitan memahami audio, guru menyediakan transkrip atau instruksi tertulis sebagai akses setara.<\/p><\/div>"}, {"g": "B", "t": "S.2 — Kolaborasi untuk meningkatkan pembelajaran", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Pembelajaran tidak dikerjakan guru sendirian. Kolaborasi dapat melibatkan murid, guru lain, tenaga kependidikan, orang tua/wali, dan masyarakat sesuai tujuan serta batas profesional.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Tujuan dan peran kolaborasi jelas.<\/li><li>Informasi yang dibagikan relevan dan seperlunya.<\/li><li>Komunikasi dengan keluarga menjaga privasi dan menghormati martabat murid.<\/li><li>Hasil kolaborasi ditindaklanjuti.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Guru Informatika berkoordinasi dengan wali kelas dan orang tua untuk mendukung murid yang mengalami kendala akses LMS. Informasi perkembangan individu disampaikan melalui jalur pribadi, bukan grup umum.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Jika masalah belajar memerlukan dukungan keluarga, hubungi wali murid terkait secara pribadi dan fokus pada strategi dukungan, bukan menyebarkan nilai semua murid.<\/p><\/div>"}, {"g": "B", "t": "S.3 — Organisasi profesi dan komunitas pembelajaran", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru aktif belajar bersama komunitas profesi/komunitas belajar untuk berbagi praktik, menelaah masalah, memperoleh masukan, dan mengembangkan kompetensi.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Berbagi perangkat ajar atau praktik baik secara bertanggung jawab.<\/li><li>Mengikuti diskusi, pelatihan, atau telaah sejawat.<\/li><li>Menerima kritik profesional dengan terbuka.<\/li><li>Menerapkan hasil belajar dan mengevaluasi dampaknya.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Guru bergabung dalam komunitas belajar Informatika untuk menelaah soal berpikir komputasional, menguji LKPD unplugged, dan membandingkan rubrik asesmen.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Dalam soal kasus, identifikasi tujuan, bukti kebutuhan murid, kendala, dan pilih tindakan yang mempertahankan kompetensi sambil memberi dukungan yang adil serta dapat dievaluasi.<\/p><\/div>"}, {"g": "B", "t": "PF.1 — Menguasai tujuan pendidikan pada satuan pendidikan", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru memahami arah pendidikan dan tujuan satuan pendidikan, lalu menghubungkan pembelajaran mata pelajaran dengan pembentukan kompetensi, karakter, dan kebutuhan murid.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Memahami tujuan dan konteks satuan pendidikan.<\/li><li>Mengaitkan tujuan mata pelajaran dengan perkembangan murid.<\/li><li>Menyusun kegiatan yang mendukung tujuan satuan pendidikan.<\/li><li>Tidak menyempitkan pembelajaran menjadi penyelesaian materi semata.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Pembelajaran Informatika mendukung kemampuan bernalar kritis, kreatif, kolaboratif, dan bertanggung jawab digital melalui proyek analisis data yang relevan dengan lingkungan sekolah.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Dalam soal kasus, identifikasi tujuan, bukti kebutuhan murid, kendala, dan pilih tindakan yang mempertahankan kompetensi sambil memberi dukungan yang adil serta dapat dievaluasi.<\/p><\/div>"}, {"g": "B", "t": "PF.2 — Menguasai disiplin ilmu", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru memahami konsep, prinsip, prosedur, dan perkembangan bidang ilmu yang diajarkan. Penguasaan materi juga berarti mampu menjelaskan alasan, mengenali miskonsepsi, dan memilih representasi yang tepat.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Konsep dan istilah akurat.<\/li><li>Mampu menjelaskan hubungan antarkonsep.<\/li><li>Mengenali miskonsepsi umum.<\/li><li>Mampu memilih contoh, analogi, model, dan representasi yang benar.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Guru memahami bahwa algoritma adalah urutan langkah logis untuk menyelesaikan masalah, bukan hanya kode program. Guru dapat menunjukkan representasi narasi, pseudocode, dan flowchart serta menjelaskan kelebihan dan batasnya.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Dalam soal kasus, identifikasi tujuan, bukti kebutuhan murid, kendala, dan pilih tindakan yang mempertahankan kompetensi sambil memberi dukungan yang adil serta dapat dievaluasi.<\/p><\/div>"}, {"g": "B", "t": "PF.3 — Memahami potensi dan kebutuhan murid serta konteks lokal", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru memahami bagaimana karakteristik materi dan konteks memengaruhi cara murid belajar. Kebutuhan murid dapat berbeda menurut pengetahuan awal, bahasa, pengalaman, akses, minat, dan dukungan.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Mengidentifikasi prasyarat materi.<\/li><li>Membaca bukti kesulitan dan potensi murid.<\/li><li>Menghubungkan materi dengan konteks lokal secara tepat.<\/li><li>Memilih dukungan yang relevan tanpa memberi label tetap.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Sebelum mengajarkan spreadsheet, guru memeriksa kemampuan membaca tabel dan operasi hitung dasar. Contoh data dapat diambil dari lingkungan sekolah dengan tetap menjaga privasi.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Dalam soal kasus, identifikasi tujuan, bukti kebutuhan murid, kendala, dan pilih tindakan yang mempertahankan kompetensi sambil memberi dukungan yang adil serta dapat dievaluasi.<\/p><\/div>"}, {"g": "B", "t": "PF.4 — Kurikulum adaptif dan kontekstual", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru memahami kurikulum, capaian fase, tujuan pembelajaran, alur tujuan, serta prinsip penyesuaian pembelajaran. Adaptif berarti menyesuaikan cara dan dukungan dengan konteks tanpa kehilangan arah kompetensi.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Mampu menghubungkan CP, TP, ATP, dan asesmen.<\/li><li>Memilih materi dan strategi sesuai tujuan.<\/li><li>Memperbarui konteks dan sumber belajar mengikuti perkembangan zaman.<\/li><li>Menyesuaikan pembelajaran berdasarkan kebutuhan dan kebijakan yang berlaku.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Guru merancang TP agar murid mampu menganalisis data, memilih bentuk visualisasi, dan menjelaskan kesimpulan. Spreadsheet menjadi alat yang dipilih karena sesuai tujuan, bukan tujuan itu sendiri.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Dalam soal kasus, identifikasi tujuan, bukti kebutuhan murid, kendala, dan pilih tindakan yang mempertahankan kompetensi sambil memberi dukungan yang adil serta dapat dievaluasi.<\/p><\/div>"}, {"g": "B", "t": "PF.5 — Mengembangkan praktik profesional secara konseptual, empiris, kreatif, dan inovatif", "h": "<div class=\"blk def\"><b class=\"lb\">Makna praktis<\/b><p>Guru mengembangkan praktik dengan dasar teori, bukti dari kelas, kreativitas, dan evaluasi. Inovasi bukan sekadar memakai aplikasi baru; inovasi harus menjawab kebutuhan belajar dan diperiksa dampaknya.<\/p><\/div><div class=\"blk\"><b class=\"lb\">Indikator yang dapat diamati<\/b><ul><li>Memiliki alasan konseptual atas pilihan strategi.<\/li><li>Mengumpulkan bukti proses/hasil belajar.<\/li><li>Menguji perbaikan secara terencana.<\/li><li>Mendokumentasikan dan membagikan pembelajaran dari praktik.<\/li><\/ul><\/div><div class=\"blk contoh\"><b class=\"lb\">Contoh penerapan (Informatika)<\/b><p>Guru mencoba aktivitas unplugged untuk memahami percabangan, membandingkan hasil asesmen dengan pembelajaran sebelumnya, mewawancarai beberapa murid, lalu memperbaiki instruksi berdasarkan temuan.<\/p><\/div><div class=\"blk cara\"><b class=\"lb\">Cara membaca kasus<\/b><p>Dalam soal kasus, identifikasi tujuan, bukti kebutuhan murid, kendala, dan pilih tindakan yang mempertahankan kompetensi sambil memberi dukungan yang adil serta dapat dievaluasi.<\/p><\/div><p>Bagian Strategi Menjawab dalam PDF memberi tiga langkah inti: (1) temukan bukti dalam stimulus; (2) periksa kesesuaian tindakan; (3) patuhi aturan respons sesuai bentuk soal. Untuk soal PCK, periksa pula ketepatan konsep dan cara guru membantu murid memahaminya.<\/p>"}, {"g": "C", "t": "1. Tiga langkah inti dari PDF", "h": "<div class=\"wrap\"><table><tr><th><b>Langkah<\/b><\/th><th><b>Yang dilakukan<\/b><\/th><th><b>Pertanyaan penuntun<\/b><\/th><\/tr><tr><td>01 — Bukti dalam stimulus<\/td><td>Tandai tujuan, data awal murid, kendala, dan kata kunci seperti &#x27;langkah pertama&#x27; atau &#x27;tindakan paling tepat&#x27;.<\/td><td>Apa tujuan pembelajaran? Apa masalah sebenarnya? Siapa yang membutuhkan dukungan? Apa batasannya?<\/td><\/tr><tr><td>02 — Kesesuaian tindakan<\/td><td>Periksa hubungan antara masalah dan tindakan. Pada PCK, cek ketepatan konsep dan cara membantu murid memahami konsep.<\/td><td>Apakah tindakan mengatasi akar masalah? Apakah sesuai tujuan, materi, dan kebutuhan murid?<\/td><\/tr><tr><td>03 — Aturan respons<\/td><td>PG meminta satu pilihan; PGK Kategori menilai tiap pernyataan; PGK MCMA memilih semua jawaban tepat.<\/td><td>Apakah saya menjawab sesuai format dan tidak memilih berlebihan?<\/td><\/tr><\/table><\/div>"}, {"g": "C", "t": "2. Cara membedah stimulus dengan cepat", "h": "<p>Tujuan: tulis kemampuan yang ingin dicapai murid, bukan sekadar aktivitas yang akan dilakukan.<\/p><p>Bukti kondisi murid: catat miskonsepsi, pengetahuan awal, kesulitan, minat, akses, atau kebutuhan khusus yang disebutkan.<\/p><p>Kendala: perhatikan waktu, perangkat, lokasi, sumber belajar, keamanan, dan kondisi sekolah.<\/p><p>Peran guru: tentukan apakah kasus meminta tindakan pertama, tindakan paling tepat, tindak lanjut, atau evaluasi.<\/p><p>Kriteria jawaban: pilih tindakan yang menjaga tujuan, berpusat pada murid, inklusif, akurat, etis, dan dapat ditindaklanjuti.<\/p>"}, {"g": "C", "t": "3. Mengenali bentuk soal", "h": "<div class=\"wrap\"><table><tr><th><b>Bentuk<\/b><\/th><th><b>Cara menjawab<\/b><\/th><th><b>Kesalahan umum<\/b><\/th><\/tr><tr><td>PG — Pilihan Ganda<\/td><td>Pilih satu opsi yang paling tepat terhadap seluruh bukti kasus.<\/td><td>Memilih opsi yang terdengar baik tetapi tidak menjawab akar masalah.<\/td><\/tr><tr><td>PGK Kategori<\/td><td>Nilai setiap pernyataan satu per satu sesuai kategori yang diminta, misalnya Sesuai/Tidak sesuai.<\/td><td>Menganggap hanya ada satu pernyataan benar atau menilai berdasarkan kesan umum.<\/td><\/tr><tr><td>PGK MCMA<\/td><td>Pilih semua opsi yang benar; setiap opsi diuji secara mandiri.<\/td><td>Memilih semua opsi yang positif tanpa memeriksa privasi, akses, tujuan, dan konteks.<\/td><\/tr><\/table><\/div>"}, {"g": "C", "t": "4. PCK — Pedagogical Content Knowledge", "h": "<p>PCK adalah pengetahuan tentang bagaimana mengajarkan materi tertentu agar dapat dipahami murid. Guru tidak cukup menguasai isi materi; guru juga perlu mengetahui kesulitan dan miskonsepsi yang mungkin muncul serta memilih representasi, contoh, pertanyaan, dan aktivitas yang membantu.<\/p><div class=\"wrap\"><table><tr><th><b>Komponen PCK<\/b><\/th><th><b>Pertanyaan<\/b><\/th><th><b>Contoh Informatika<\/b><\/th><\/tr><tr><td>Ketepatan konten<\/td><td>Apakah konsep yang diajarkan benar?<\/td><td>Membedakan data, informasi, algoritma, program, internet, dan web.<\/td><\/tr><tr><td>Miskonsepsi murid<\/td><td>Kesalahan pemahaman apa yang mungkin muncul?<\/td><td>Murid menganggap algoritma selalu harus ditulis dengan bahasa pemrograman.<\/td><\/tr><tr><td>Representasi<\/td><td>Model atau analogi apa yang membantu?<\/td><td>Memeragakan percabangan dengan kartu kondisi sebelum menulis pseudocode.<\/td><\/tr><tr><td>Strategi pedagogis<\/td><td>Aktivitas apa yang membuat konsep dipahami?<\/td><td>Murid menjalankan instruksi, menguji kasus, dan memperbaiki flowchart.<\/td><\/tr><tr><td>Asesmen pemahaman<\/td><td>Bukti apa yang menunjukkan murid benar-benar paham?<\/td><td>Murid menjelaskan alasan pemilihan kondisi dan menguji input berbeda.<\/td><\/tr><\/table><\/div>"}, {"g": "C", "t": "5. Pola eliminasi opsi yang kurang tepat", "h": "<p>Opsi mengganti tujuan pembelajaran hanya karena kegiatan utama sulit dilakukan.<\/p><p>Opsi menilai hal yang bukan kompetensi sasaran, misalnya kerapian poster saat tujuan mengukur penalaran konsep.<\/p><p>Opsi mempermalukan murid, membuka nilai pribadi, atau menyebarkan data asesmen.<\/p><p>Opsi mewajibkan perangkat/internet tanpa alternatif bagi murid yang aksesnya terbatas.<\/p><p>Opsi hanya meminta hafalan ketika kasus meminta pemahaman, penerapan, analisis, atau revisi alasan berdasarkan bukti.<\/p><p>Opsi mengumpulkan aktivitas tanpa memeriksa apakah aktivitas itu menghasilkan bukti belajar yang relevan.<\/p>"}, {"g": "C", "t": "6. Kerangka jawaban untuk soal uraian/refleksi", "h": "<p>Saya akan (tindakan) karena (bukti kebutuhan/masalah dalam kasus). Tindakan ini tetap mengarah pada (tujuan pembelajaran), menyediakan (dukungan/akomodasi), dan menghasilkan bukti berupa (hasil kerja/observasi/asesmen). Setelah itu saya akan (umpan balik/tindak lanjut) dengan tetap menjaga (privasi/keadilan/keselamatan).<\/p>"}];
